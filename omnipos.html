<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b4411f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>OmniPOS</title><style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mu:#7a746b;--card:#fff;--ln:#e6e1d8;--ac:#b4411f;--on:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,#brand{font-family:Georgia,serif;font-weight:700}h2{font-size:2rem;margin:.2em 0 .6em}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
#brand{font-size:1.4rem;color:var(--ac)}nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mu);padding:.4rem .7rem;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-color:var(--ac)}
#nav-toggle{display:none}
main{max-width:1200px;margin:auto;padding:1rem 1.2rem 4rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
input,select{padding:.6rem;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac)}
.search{width:100%;margin-bottom:.8rem}
.btn,.btn2{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer;font:inherit;min-height:42px}
.btn2{background:none;color:var(--ac)}.sm{padding:.2rem .5rem;min-height:0;font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:.8rem;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1rem}
.kpi div{border-left:3px solid var(--ac);padding-left:.8rem}.kpi small{color:var(--mu);display:block}.kpi b{font:700 1.7rem Georgia,serif}
.pos{display:grid;grid-template-columns:1fr 360px;gap:1rem}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.pg button{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:.7rem;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-height:70px}
.pg button:disabled{opacity:.4}.pg small{color:var(--mu);display:block}
.tot{font:700 2.2rem Georgia,serif;color:var(--ac)}.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.3rem 0}
.low{color:var(--ac);font-weight:600}.mu{color:var(--mu)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:4px;display:none;z-index:9}
#th{margin-left:auto;min-height:36px;padding:.3rem .8rem}
form label{display:grid;gap:.25rem;color:var(--mu);font-size:.8rem}
.sum td{border-top:2px solid var(--fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chips .on{background:var(--ac);color:var(--on)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:1rem;z-index:20}.modal.show{display:flex}.modal-card{width:min(680px,100%);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:1rem;max-height:90vh;overflow:auto}.modal-card h3{margin:0}.modal-card input,.modal-card select{width:100%}
@media(max-width:760px){
  header{gap:.5rem .8rem}
  #nav-toggle{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:36px;margin-left:auto;padding:.45rem .7rem}
  #th{margin-left:0}
  nav{display:none;width:100%;flex-direction:column;gap:.35rem;padding-top:.3rem}
  nav.open{display:flex}
  nav button{padding:.6rem .8rem;border-bottom:0;border-left:2px solid transparent;border-radius:4px}
  nav button.on{border-left-color:var(--ac);border-bottom-color:transparent}
}
</style></head>
<body>
<header><b id="brand">OmniPOS</b><button id="nav-toggle" class="btn2" type="button" aria-label="Buka menu" aria-expanded="false" onclick="App.toggleNav()">☰</button><button id="th" class="btn2" onclick="App.theme()" type="button">Tema</button></header>
<main id="main"></main><div id="toast"></div>
<script>
window.App={views:{},after:{}};
App.canStore=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
(function(A){
const K='omnipos_v1';
let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
A.db=d||{products:[],sales:[],days:{},settings:{name:'Toko Saya',tax:0,seq:0,waNo:'',kontak:''}};
A.save=()=>{try{localStorage.setItem(K,JSON.stringify(A.db))}catch(e){A.toast('Gagal menyimpan: '+e.message)}};
A.id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
A.rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
A.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
A.$=id=>document.getElementById(id);
A.toast=m=>{const t=A.$('toast');if(!t)return; t.textContent=m; t.style.display='block'; clearTimeout(A._t); A._t=setTimeout(()=>t.style.display='none',2500)};
A.prod=id=>A.db.products.find(p=>p.id===id);
A.download=(name,text,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
A.migrate=()=>{const D=A.db;D.days=D.days||{};D.products=D.products||[];D.sales=D.sales||[];D.settings=D.settings||{name:'Toko Saya',tax:0,seq:0,waNo:'',kontak:''};D.settings.waNo=D.settings.waNo||D.settings.kontak||'';D.settings.kontak=D.settings.kontak||D.settings.waNo||'';delete D.moves;D.products.forEach(p=>{delete p.opening;delete p._legacy;});}
A.migrate();
A.dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
A.recv=(day,pid)=>{const r=(A.db.days[day]||{}).recv;return r&&pid in r?r[pid]:null};
A.tin=(day,pid)=>{const r=(A.db.days[day]||{}).transferIn;return r&&pid in r?r[pid]:null};
A.tout=(day,pid)=>{const r=(A.db.days[day]||{}).transferOut;return r&&pid in r?r[pid]:null};
A.sold=(day,pid)=>A.db.sales.reduce((a,s)=>s.status==='done'&&A.dk(s.at)===day?a+s.items.filter(i=>i.pid===pid).reduce((x,i)=>x+i.qty,0):a,0);
A.sisa=(day,pid)=>{const r=A.recv(day,pid),ti=A.tin(day,pid),to=A.tout(day,pid);const stock=(r===null?0:r)+(ti===null?0:ti)-(to===null?0:to);if(r===null&&ti===null&&to===null)return null;return stock-[...];
A.transferMode='in';
A.openTransfer=(type)=>{A.transferMode=type;const modal=A.$('transferModal');if(!modal)return;const title=A.$('transferTitle');if(title)title.textContent=type==='in'?'Transfer In':'Transfer Out';modal.classList.add('show')};
A.closeTransfer=()=>{const modal=A.$('transferModal');if(modal)modal.classList.remove('show')};
})(App);
</script>
<script>
(function(A){
let edit=null;
A.views.produk=()=>{const p=edit?A.prod(edit):{};return `<h2>Produk</h2><form class="card grid" onsubmit="App.pSave(event)">
<label>Nama produk<input name=name required value="${A.esc(p.name)}"></label>
<label>Harga jual<input name=price type=number min=0 step=1 required value="${p.price??''}"></label>
<button class=btn>${edit?'Simpan':'Tambah'}</button>${edit?'<button type=button class=btn2 onclick="App.pEdit(null)">Batal</button>':''}</form><div id=plist class=tw></div>`};
A.after.produk=()=>{const r=A.db.products.filter(p=>!p.archived);A.$('plist').innerHTML=r.length?`<table><tr><th>Produk<th>Harga<th></tr>${r.map(p=>`<tr><td>${A.esc(p.name)}<td>${A.rp(p.price)}<td><button class=btn2 onclick="App.pEdit('${p.id}')">Edit</button> <button class=btn2 onclick="App.pArch('${p.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<p class=mu>Belum ada produk.</p>'};
A.pEdit=id=>{edit=id;A.go('produk')};
A.pSave=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),price=Math.floor(+f.get('price'));if(!name||!(price>=0))return A.toast('Data tidak valid');if(edit){const p=A.prod(edit);Object.assign(p,{name,price});}else A.db.products.push({id:A.id(),name,price,archived:false});A.save();edit=null;A.go('produk')};
A.pArch=id=>{if(confirm('Hapus produk dari daftar? Riwayat penjualan tetap aman.')){A.prod(id).archived=true;A.save();A.go('produk')}};
})(App);
</script>
<script>
(function(A){
const last=(day,pid)=>{const ks=Object.keys(A.db.days).filter(k=>k<day).sort();for(let i=ks.length-1;i>=0;i--){const r=A.db.days[ks[i]].recv;if(r&&pid in r)return r[pid]}return''};
A.views.terima=()=>{const day=A.dk(Date.now()),ps=A.db.products.filter(p=>!p.archived);return `<h2>Barang Diterima</h2><p class=mu>Isi stok harian untuk barang diterima. Untuk transfer antar kios/kedai, gunakan menu Transfer.</p>
<div class="card" style="display:flex;flex-wrap:wrap;gap:.5rem"><button class="btn2" type="button" onclick="App.openTransfer('in')">Transfer In</button><button class="btn2" type="button" onclick="App.openTransfer('out')">Transfer Out</button></div>
<form class="card" onsubmit="App.tSave(event)">${ps.map(p=>{const v=A.recv(day,p.id);return`<div class=row><span>${A.esc(p.name)}${v===null?'':' <small class=mu>(sudah diisi)</small>'}</span><input name="r_${p.id}" type=number min=0 step=1 value="${v===null?'':v}" placeholder="${last(day,p.id)!===''?('Prev: '+last(day,p.id)):''}"></div>`}).join('')}<button class=btn>Simpan stok hari ini</button></form>
<div id="transferModal" class="modal" aria-hidden="true"><div class="modal-card"><div class="row"><h3 id="transferTitle">Transfer In</h3><button type="button" class="btn2" onclick="App.closeTransfer()">Tutup</button></div><div class="card"><label>Produk<select id="transferProduct">${ps.map(p=>`<option value="${p.id}">${A.esc(p.name)}</option>`).join('')}</select></label><label>Jumlah<input id="transferQty" type=number min=1 step=1 value=1></label><button class="btn" type="button" onclick="App.transferSave()">Simpan</button></div></div></div>`};
A.after.terima=()=>{const modal=A.$('transferModal');if(modal)modal.classList.remove('show')};
A.tSave=e=>{e.preventDefault();const f=new FormData(e.target),day=A.dk(Date.now()),r={};for(const p of A.db.products.filter(p=>!p.archived)){const v=f.get('r_'+p.id);if(v===''||v===null)continue;const n=Math.floor(+v);if(n<0)continue;r[p.id]=n;}if(Object.keys(r).length){A.db.days[day]=A.db.days[day]||{};A.db.days[day].recv=r;A.save();A.toast('Stok harian tersimpan')}else A.toast('Tidak ada data stok yang diisi')};
A.transferSave=()=>{const day=A.dk(Date.now()),pid=A.$('transferProduct').value,qty=Math.floor(+A.$('transferQty').value||0);if(!pid||qty<=0)return A.toast('Jumlah transfer tidak valid');const d=A.db.days[day]||(A.db.days[day]={});const key=A.transferMode==='in'?'transferIn':'transferOut';const map=d[key]||(d[key]={});map[pid]=(map[pid]||0)+qty;A.save();A.closeTransfer();A.toast(A.transferMode==='in'?'Transfer In tersimpan':'Transfer Out tersimpan');A.go('terima')};
})(App);
</script>
<script>
(function(A){
A.cart=[];A.key=A.id();let q='',disc=0,pay='pas';
const day=()=>A.dk(Date.now());
const sum=()=>{const sub=A.cart.reduce((a,c)=>a+A.prod(c.pid).price*c.qty,0),d=Math.min(disc,sub),tax=Math.round((sub-d)*(A.db.settings.tax||0)/100);return{sub,d,tax,total:sub-d+tax}};
A.views.pos=()=>`<div class=pos><div><h2>Kasir</h2><input class=search placeholder="Cari produk..." oninput="App.xQ(this.value)"><div id=pg class=pg></div></div>
<div class=card><h3>Keranjang</h3><div id=cl></div>
<div class=row><span>Diskon (Rp)</span><input type=number min=0 style="width:120px" value="${disc||''}" oninput="App.xDisc(this.value)"></div>
<div class=row><span>Metode</span><select id=pm onchange="App.xTot()"><option>Tunai<option>Transfer<option>Lainnya</select></div>
<div id=cw><div class=row><span>Uang diterima</span></div><div class=chips id=cb></div><input id=cash type=number min=0 placeholder="Masukkan nominal uang diterima" style="display:${pay==='manual'?'block':'none'}"></div>
<div id=tt></div><button class=btn style="width:100%;margin-top:.6rem" id=co onclick="App.checkout()">Bayar</button></div></div>`;
const grid=()=>{const r=A.db.products.filter(p=>!p.archived&&p.name.toLowerCase().includes(q.toLowerCase()));A.$('pg').innerHTML=r.map(p=>{const s=A.sisa(day(),p.id);return`<button ${!s||s<=0?'disabled':''} onclick="App.xAdd('${p.id}')"><b>${A.esc(p.name)}</b><small>${s===null?'Belum ada stok':s<=0?'Stok habis':'Stok: '+s}</small></button>`}).join('')};
const cart=()=>{A.$('cl').innerHTML=A.cart.map((c,i)=>{const p=A.prod(c.pid);return`<div class=row><span>${A.esc(p.name)}<br><small class=mu>${A.rp(p.price)}</small></span><span><input type=number min=1 style="width:70px" value="${c.qty}" onchange="App.xQty(${i},this.value)"> <button type=button class=btn2 onclick="App.xDel(${i})">Hapus</button></span></div>`}).join('')||'<p class=mu>Keranjang kosong</p>'};
const chips=()=>{A.$('cb').innerHTML=[['pas','Uang pas'],[20000,'20rb'],[50000,'50rb'],[100000,'100rb'],['manual','Lainnya']].map(([v,t])=>`<button type="button" class="btn2 ${pay===v?'on':''}" onclick="App.xPay('${v}')">${t}</button>`).join('')};
const cashAmt=t=>pay==='pas'?t.total:pay==='manual'?(+A.$('cash').value||0):pay;
A.xPay=v=>{pay=(v==='pas'||v==='manual')?v:+v;const i=A.$('cash');if(i)i.style.display=pay==='manual'?'block':'none';chips();A.xTot();if(pay==='manual'&&i)i.focus()};
A.after.pos=()=>{grid();cart();chips();A.xTot()};
A.xQ=v=>{q=v;grid()};
A.xAdd=id=>{const c=A.cart.find(c=>c.pid===id),s=A.sisa(day(),id);if(s===null)return A.toast('Isi barang diterima dulu');if((c?c.qty:0)+1>s)return A.toast('Stok habis');c?c.qty++:A.cart.push({pid:id,qty:1});cart();A.xTot()};
A.xQty=(i,v)=>{const n=Math.floor(+v),s=A.sisa(day(),A.cart[i].pid);if(n>=1&&n<=s)A.cart[i].qty=n;else A.toast('Jumlah tidak valid');cart();A.xTot()};
A.xDel=i=>{A.cart.splice(i,1);cart();A.xTot()};A.xDisc=v=>{disc=Math.max(0,Math.floor(+v)||0);A.xTot()};
A.xTot=()=>{const t=sum(),tunai=A.$('pm').value==='Tunai',c=cashAmt(t);A.$('cw').style.display=tunai?'':'none';A.$('tt').innerHTML=`<div class=row><span>Subtotal</span><span>${A.rp(t.sub)}</span></div><div class=row><span>Diskon</span><span>- ${A.rp(t.d)}</span></div><div class=row><span>Pajak</span><span>${A.rp(t.tax)}</span></div><div class=row><span>Total</span><span>${A.rp(t.total)}</span></div>${tunai?`<div class=row><span>Uang diterima</span><span>${A.rp(c)}</span></div><div class=row><span>Kembali</span><span>${A.rp(Math.max(0,c-t.total))}</span></div>`:''}`;};
A.checkout=()=>{if(!A.cart.length)return A.toast('Keranjang kosong');if(A.db.sales.some(s=>s.key===A.key))return A.toast('Transaksi ini sudah tersimpan');const t=sum(),m=A.$('pm').value,cash=cashAmt(t);if(m==='Tunai'&&cash<t.total)return A.toast('Uang diterima belum cukup');const sale={id:A.id(),key:A.key,no:A.db.settings.seq?A.db.settings.seq+1:1,at:Date.now(),method:m,items:A.cart.map(i=>({pid:i.pid,qty:i.qty,price:A.prod(i.pid).price})),status:'done',discount:t.d,payment:cash,total:t.total};sale.no='TRX-'+String(sale.no).padStart(4,'0');A.db.settings.seq=(A.db.settings.seq||0)+1;A.db.sales.push(sale);A.db.sales.sort((a,b)=>b.at-a.at);A.save();A.cart=[];A.key=A.id();disc=0;pay='pas';A.go('laporan');A.toast('Transaksi berhasil disimpan');A.after.laporan&&A.after.laporan();};
const soc=()=>{const t=A.db.settings;return[t.ig&&'IG: @'+t.ig,t.tiktok&&'TikTok: @'+t.tiktok].filter(Boolean).join('\n')};
A.receipt=s=>{const T=A.db.settings,w=window.open('','_blank','width=390,height=700');if(!w)return A.toast('Popup diblokir — lihat struk di menu Laporan');const items=s.items.map(i=>`<div class="row"><span>${A.esc(A.prod(i.pid).name)} x${i.qty}</span><span>${A.rp(i.price*i.qty)}</span></div>`).join('');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px/1.5 sans-serif;padding:16px} .row{display:flex;justify-content:space-between} h2{margin:0 0 8px} small{color:#666}</style></head><body><h2>${A.esc(T.name||'OmniPOS')}</h2><small>${A.esc(T.lokasi||'')}</small><hr>${items}<hr><div class="row"><b>Total</b><b>${A.rp(s.total)}</b></div><p>${A.esc(T.kasir?('Kasir: '+T.kasir):'')}</p></body></html>`);w.document.close();};
})(App);
</script>
<script>
(function(A){
let day=A.dk(Date.now());
const lbl=()=>new Date(day+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
A.views.laporan=()=>`<h2>Laporan Harian</h2><div class="card"><div class="row"><input type=date value="${day}" max="${A.dk(Date.now())}" onchange="App.lD(this.value)"> <button class=btn2 onclick="App.lCsv()">CSV stok</button> <button class=btn2 onclick="App.lCsvJ()">CSV penjualan</button></div><div class="row" style="margin-top:.75rem"><button class=btn2 type="button" onclick="App.wa()">Kirim WA / WA Business</button> <button class=btn2 type="button" onclick="App.waShare()">Bagikan</button> <button class=btn2 type="button" onclick="App.waCopy()">Salin teks</button></div><div class="row" style="margin-top:.75rem"><span>Nomor WA</span><input id="wano" type="tel" value="${A.esc(A.db.settings.waNo||A.db.settings.kontak||'')}" placeholder="08xxxxxxxxxx" style="max-width:240px" oninput="App.db.settings.waNo=this.value.trim();A.save();"></div></div>`;
const calc=()=>{const ok=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day),by={};ok.forEach(x=>by[x.method]=(by[x.method]||0)+x.total);const rows=A.db.products.filter(p=>!p.archived).map(p=>{const terima=A.recv(day,p.id)??0,transferIn=A.tin(day,p.id)??0,transferOut=A.tout(day,p.id)??0,terjual=A.db.sales.filter(s=>s.status==='done'&&A.dk(s.at)===day).reduce((a,s)=>a+s.items.filter(i=>i.pid===p.id).reduce((x,i)=>x+i.qty,0),0);return{...p,terima,transferIn,transferOut,terjual,sisa:(terima+transferIn-transferOut-terjual)};});return{n:(v)=>v==null||v===0?'0':String(v),rows,by,ok};};
const render=()=>{const r=calc(),n=r.n;A._rep=r;const all=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day).sort((a,b)=>b.at-a.at);A.$('rep').innerHTML=`<p class=mu>${lbl()}</p><div class=kpi><div><small>Total penjualan</small><b>${A.rp(r.ok.reduce((a,x)=>a+x.total,0))}</b></div><div><small>Transaksi</small><b>${r.ok.length}</b></div><div><small>Metode</small><b>${Object.keys(r.by).length||0}</b></div></div>
<p class=mu>${Object.entries(r.by).map(([k,v])=>`${k}: ${A.rp(v)}`).join(' · ')||'Belum ada penjualan pada tanggal ini'}</p>
<h3>Stok hari ini</h3><div class=tw><table><tr><th>Produk<th>Diterima<th>Transfer In<th>Transfer Out<th>Terjual<th>Sisa</tr>${r.rows.map(x=>`<tr><td>${A.esc(x.name)}<td>${n(x.terima)}<td>${n(x.transferIn)}<td>${n(x.transferOut)}<td>${n(x.terjual)}<td>${n(x.sisa)}</tr>`).join('')}</table></div>
<p class=mu>Sisa = diterima + transfer in − transfer out − terjual.</p>
<h3>Riwayat penjualan</h3><div class=tw><table><tr><th>No<th>Waktu<th>Metode<th>Diterima<th></tr>${all.map(s=>`<tr><td>${s.no}<td>${new Date(s.at).toLocaleTimeString('id-ID')}<td>${s.method}<td>${A.rp(s.total)}<td><button class=btn2 onclick="App.lPrint('${s.id}')">Struk</button> ${s.status==='done'?`<button class=btn2 onclick="App.lVoid('${s.id}')">Void</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5><p class=mu>Belum ada penjualan.</p></td></tr>'}</table></div>`;};
A.after.laporan=render;
A.txt=()=>{const r=A._rep,T=A.db.settings;if(!r)return'';const n=r.n;return[`*Laporan ${T.name||'Toko Saya'}*`,lbl(),`Dibuat: ${new Date().toLocaleString('id-ID')}`,(T.kasir?`Kasir: ${T.kasir}`:''),(T.lokasi?`Lokasi: ${T.lokasi}`:''),'',`Total penjualan: ${A.rp(r.ok.reduce((a,x)=>a+x.total,0))}`,`Transaksi: ${(r.ok.length)}`,`Metode: ${Object.entries(r.by).map(([k,v])=>`${k}: ${A.rp(v)}`).join(' · ')||'Belum ada'}`,'','Stok hari ini:',...r.rows.map(x=>`${x.name}: diterima ${n(x.terima)}, transfer in ${n(x.transferIn)}, transfer out ${n(x.transferOut)}, terjual ${n(x.terjual)}, sisa ${n(x.sisa)}`),'',`Dibuat via OmniPOS`].filter(Boolean).join('\n')};
A.wa=()=>{const el=A.$('wano');const raw=(el?el.value:A.db.settings.waNo||A.db.settings.kontak||'').trim();const num=String(raw).replace(/\D/g,'');if(!num){A.toast('Isi nomor WA terlebih dahulu');A.go('set');return;}const phone=num.startsWith('0')?`62${num.slice(1)}`:num.startsWith('62')?num:num;A.db.settings.waNo=raw;A.save();window.open(`https://wa.me/${phone}?text=${encodeURIComponent(A.txt())}`,'_blank');};
A.waShare=()=>{const text=A.txt();if(navigator.share){navigator.share({title:A.db.settings.name||'OmniPOS',text}).catch(()=>{});return;}const raw=(A.db.settings.waNo||A.db.settings.kontak||'').trim();const num=String(raw).replace(/\D/g,'');if(num){const phone=num.startsWith('0')?`62${num.slice(1)}`:num.startsWith('62')?num:num;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank');return;}A.toast('Nomor WA belum diisi');};
A.waCopy=()=>{const t=A.txt(),ok=()=>A.toast('Teks laporan disalin');if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(ok,()=>A.toast('Gagal menyalin'));const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok();}catch(e){A.toast('Gagal menyalin')}finally{x.remove();}};
A.lD=v=>{if(v){day=v;render()}};A.lPrint=id=>A.receipt(A.db.sales.find(s=>s.id===id));A.lVoid=id=>{const s=A.db.sales.find(s=>s.id===id);if(!s||s.status!=='done'||!confirm('Refund '+s.no+'? Stok akan dikembalikan.'))return;A.db.sales=A.db.sales.map(x=>x.id===id?{...x,status:'void'}:x);A.save();A.go('laporan');A.toast('Transaksi dibatalkan');};
const csv=(n,r)=>A.download(n,r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
A.lCsv=()=>{const r=calc();csv('stok-'+day+'.csv',[['produk','diterima','transfer_in','transfer_out','terjual','sisa'],...r.rows.map(x=>[x.name,r.n(x.terima),r.n(x.transferIn),r.n(x.transferOut),r.n(x.terjual),r.n(x.sisa)]])};
A.lCsvJ=()=>csv('penjualan-'+day+'.csv',[['no','waktu','metode','diterima'],...A.db.sales.filter(s=>s.status==='done'&&A.dk(s.at)===day).map(s=>[s.no,new Date(s.at).toISOString(),s.method,s.total])]);
})(App);
</script>
<script>
(function(A){
const tabs={laporan:'Laporan',pos:'Kasir',terima:'Terima',produk:'Produk',set:'Pengaturan'};
A.views.set=()=>{const s=A.db.settings;return`<h2>Pengaturan</h2><form class="card grid" onsubmit="App.sSave(event)">
<label>Nama toko<input name=name value="${A.esc(s.name)}" required></label>
<label>Nama kasir<input name=kasir value="${A.esc(s.kasir)}"></label>
<label>Lokasi merchant<input name=lokasi value="${A.esc(s.lokasi)}" placeholder="mis. Jl. Mawar No. 5, Kota"></label>
<label>No. kontak / WA<input name=kontak type=tel value="${A.esc(s.kontak||s.waNo||'')}" placeholder="08xxxxxxxxxx"></label>
<label>No. WhatsApp<input name=waNo type=tel value="${A.esc(s.waNo||s.kontak||'')}" placeholder="08xxxxxxxxxx"></label>
<label>Instagram<input name=ig value="${A.esc(s.ig)}" placeholder="username"></label>
<label>TikTok<input name=tiktok value="${A.esc(s.tiktok)}" placeholder="username"></label>
<label>Pajak (%)<input name=tax type=number min=0 max=100 step=0.1 value="${s.tax||0}"></label>
<button class=btn>Simpan</button></form>
<div class=card><h3>Backup &amp; Restore</h3><p class=mu>Data tersimpan di browser (localStorage). Jika data situs dihapus, data hilang — rutin unduh backup.</p>
<button class=btn onclick="App.sBackup()">Unduh backup JSON</button> <label class=btn2 style="display:inline-block;cursor:pointer;padding:.6rem 1rem">Restore<input type=file accept=".json" hidden onchange="App.sRestore(event.target.files[0])"></label></div>`};
A.sSave=e=>{e.preventDefault();const f=new FormData(e.target);const waNo=(f.get('waNo')||f.get('kontak')||'').toString().trim();const kontak=(f.get('kontak')||'').toString().trim();Object.assign(A.db.settings,{name:f.get('name').trim(),kasir:f.get('kasir').trim(),lokasi:f.get('lokasi').trim(),kontak:kontak,waNo:waNo,ig:f.get('ig').trim(),tiktok:f.get('tiktok').trim(),tax:+(f.get('tax')||0)});A.save();A.toast('Pengaturan tersimpan');A.go('set')};
A.sBackup=()=>A.download('omnipos-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:2,...A.db}),'application/json');
A.sRestore=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.settings)throw 0;localStorage.setItem('omnipos_v1',JSON.stringify(d));A.db=d;A.save();A.toast('Backup dipulihkan');A.go('pos');}catch(e){A.toast('File backup tidak valid')}};r.readAsText(f);};
const TH=['system','light','dark'],THL={system:'Sistem',light:'Terang',dark:'Gelap'};
A.applyTheme=()=>{const t=A.db.settings.theme||'system';if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;const btn=A.$('th');if(btn)btn.textContent='Tema: '+THL[t]||'Tema';};
A.theme=()=>{const t=A.db.settings.theme||'system';A.db.settings.theme=TH[(TH.indexOf(t)+1)%3];A.save();A.applyTheme()};
A.toggleNav=()=>{A.navOpen=!A.navOpen;const nav=A.$('nav'),btn=A.$('nav-toggle');if(!nav||!btn)return;nav.classList.toggle('open',A.navOpen);btn.textContent=A.navOpen?'✕':'☰';btn.setAttribute('aria-expanded',String(A.navOpen));};
A.go=n=>{A.applyTheme();A.$('brand').textContent=A.db.settings.name;A.$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===n?'on':''}" onclick="App.go('${k}')">${v}</button>`).join('');const main=A.$('main');if(A.views[n])main.innerHTML=A.views[n]();if(A.after[n])A.after[n]();};
window.addEventListener('resize',()=>{if(window.innerWidth>760){A.$('nav').classList.remove('open');A.navOpen=false;const btn=A.$('nav-toggle');if(btn){btn.textContent='☰';btn.setAttribute('aria-expanded','false');}}});
A.go('pos');
})(App);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
}
</script>

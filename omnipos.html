<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b4411f">
  <title>OmniPOS</title>
  <style>
    :root {
      --bg:#faf8f4; --fg:#1d1b18; --mu:#7a746b; --card:#fff; --ln:#e6e1d8; --ac:#b4411f; --on:#fff;
      --danger:#d8422d; --ok:#1d8c4d; --shadow:rgba(25,22,18,.08); 
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg:#17140f; --fg:#f3efe9; --mu:#b1a79a; --card:#201d17; --ln:#332f27; --ac:#e57d52; --on:#17140f;
      --danger:#ff7b63; --ok:#7ae0a0; --shadow:rgba(0,0,0,.22);
      color-scheme: dark;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0} body{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
    a{color:inherit} button,input,select{font:inherit}
    header{display:flex;align-items:center;gap:.75rem 1rem;padding:.8rem 1rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:20}
    #brand{font-family:Georgia,serif;font-weight:700;color:var(--ac);font-size:1.5rem;display:inline-flex;align-items:center;min-width:0;flex:1}
    nav{display:flex;flex-wrap:wrap;gap:.35rem}
    nav button,.btn,.btn2,.btn-danger{border-radius:8px;border:1px solid var(--ac);cursor:pointer;font:inherit}
    nav button,.btn2{background:transparent;color:var(--ac);padding:.6rem .9rem}
    nav button.on{background:var(--ac);color:var(--on)}
    .btn{background:var(--ac);color:var(--on);padding:.72rem 1rem;border:none}
    .btn-danger{background:var(--danger);color:#fff;padding:.72rem 1rem;border:none}
    .btn2{min-width:44px}
    main{max-width:1200px;margin:0 auto;padding:1rem 1.1rem 4rem}
    .card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 4px 12px var(--shadow)}
    .card h2,.card h3{margin:0 0 .75rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}
    .row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.35rem 0}
    .stack{display:grid;gap:.75rem}
    label{display:grid;gap:.35rem;color:var(--mu);font-size:.8rem}
    input,select,textarea{width:100%;padding:.72rem .8rem;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
    textarea{min-height:90px;resize:vertical}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
    table{width:100%;border-collapse:collapse} th,td{padding:.7rem .5rem;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
    th{color:var(--mu);font-size:.76rem;text-transform:uppercase}
    .muted{color:var(--mu)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin:1rem 0}
    .kpi{padding:.8rem .9rem;border-left:3px solid var(--ac);border:1px solid var(--ln);border-radius:10px;background:var(--card)}
    .kpi strong{display:block;font-size:1.6rem;line-height:1.2;font-family:Georgia,serif;margin-top:.15rem}
    .catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
    .catalog button{border:1px solid var(--ln);background:var(--card);color:var(--fg);padding:.8rem;border-radius:12px;text-align:left;min-height:116px;cursor:pointer}
    .catalog button:disabled{opacity:.45;cursor:not-allowed}
    .catalog small{display:block;color:var(--mu)}
    .cart-item{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--ln)}
    .cart-actions{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
    .circle{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--ln);width:30px;height:30px;cursor:pointer;background:transparent;color:var(--fg)}
    .totals{display:grid;gap:.4rem;padding-top:.5rem}
    .totals .row{padding:.2rem 0}
    .totals .grand{font-size:1.5rem;font-weight:700;color:var(--ac);font-family:Georgia,serif}
    .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.75rem 1rem;border-radius:999px;display:none;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .5rem;border-radius:999px;background:rgba(180,65,31,.1);border:1px solid rgba(180,65,31,.25);color:var(--ac)}
    .muted-link{color:var(--mu)}
    .table-wrap{overflow:auto}
    .danger{color:var(--danger)}
    .ok{color:var(--ok)}
    .nowrap{white-space:nowrap}
    .hidden{display:none!important}
    @media(max-width:760px){
      header{flex-wrap:wrap}
      nav{display:none;width:100%;flex-direction:column}
      nav.open{display:flex}
      #nav-toggle{display:inline-flex;margin-left:auto}
      .catalog{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    }
    @media(min-width:761px){#nav-toggle{display:none}}
  </style>
</head>
<body>
  <header>
    <div id="brand">OmniPOS</div>
    <nav id="nav"></nav>
    <button id="nav-toggle" class="btn2" type="button" aria-expanded="false" aria-label="Buka menu" onclick="app.toggleNav()">☰</button>
    <button id="theme-toggle" class="btn2" type="button" onclick="app.toggleTheme()" aria-label="Ganti tema">🌙</button>
  </header>
  <main id="main"></main>
  <div id="toast" class="toast"></div>

  <script>
    (function(){
      const STORAGE_KEY = 'omnipos_v1';
      const app = {
        view: 'kasir',
        cart: [],
        filter: '',
        reportDay: new Date().toISOString().slice(0,10),
        state: null,
        timer: null,
        productDraft: null
      };

      function defaultState(){
        return {
          products: [
            { id: 'p1', name: 'Kopi Hitam', sku: 'KOP-001', price: 12000, stock: 30, category: 'Minuman', active: true },
            { id: 'p2', name: 'Teh Tarik', sku: 'TEH-001', price: 10000, stock: 20, category: 'Minuman', active: true },
            { id: 'p3', name: 'Mie Goreng', sku: 'MIE-001', price: 18000, stock: 15, category: 'Makanan', active: true },
            { id: 'p4', name: 'Roti Coklat', sku: 'ROT-001', price: 8000, stock: 25, category: 'Cemilan', active: true }
          ],
          sales: [],
          days: {},
          settings: {
            name: 'Toko Saya',
            tax: 0,
            seq: 0,
            waNo: '',
            kontak: '',
            theme: 'light'
          }
        };
      }

      function loadState(){
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
          app.state = raw || defaultState();
        } catch (e) {
          app.state = defaultState();
        }

        app.state.products = Array.isArray(app.state.products) ? app.state.products : [];
        app.state.sales = Array.isArray(app.state.sales) ? app.state.sales : [];
        app.state.days = app.state.days && typeof app.state.days === 'object' ? app.state.days : {};
        app.state.settings = app.state.settings && typeof app.state.settings === 'object' ? app.state.settings : {};
        app.state.settings = Object.assign({
          name: 'Toko Saya',
          tax: 0,
          seq: 0,
          waNo: '',
          kontak: '',
          theme: 'light'
        }, app.state.settings);
      }

      function saveState(){
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(app.state));
        } catch (e) {
          toast('Gagal menyimpan data: ' + (e && e.message ? e.message : e));
        }
      }

      function money(v){
        return 'Rp ' + Math.round(Number(v || 0)).toLocaleString('id-ID');
      }

      function esc(str){
        return String(str == null ? '' : str).replace(/[&<>"']/g, function(ch){
          const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
          return map[ch] || ch;
        });
      }

      function uid(){
        return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      }

      function dayKey(dateLike){
        const d = new Date(dateLike);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }

      function productById(id){
        return (app.state.products || []).find(function(p){ return p.id === id; }) || null;
      }

      function toast(msg){
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(app.timer);
        app.timer = setTimeout(function(){ el.style.display = 'none'; }, 2200);
      }

      function addToCart(productId){
        const product = productById(productId);
        if (!product) return;
        if (!product.active) {
          toast('Produk ini tidak aktif');
          return;
        }
        const existing = app.cart.find(function(item){ return item.id === productId; });
        if (existing) {
          if (existing.qty >= (product.stock || 0)) {
            toast('Stok tidak cukup');
            return;
          }
          existing.qty += 1;
        } else {
          app.cart.push({ id: productId, name: product.name, price: Number(product.price || 0), qty: 1 });
        }
        renderMain();
      }

      function changeCartQty(productId, delta){
        const item = app.cart.find(function(i){ return i.id === productId; });
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
          app.cart = app.cart.filter(function(i){ return i.id !== productId; });
        }
        renderMain();
      }

      function getCartSubtotal(){
        return app.cart.reduce(function(sum, item){ return sum + item.qty * item.price; }, 0);
      }

      function getCartTax(){
        const taxRate = Number(app.state.settings.tax || 0) / 100;
        return getCartSubtotal() * taxRate;
      }

      function getCartDiscount(){
        return Number(app.discount || 0);
      }

      function getCartTotal(){
        return getCartSubtotal() + getCartTax() - getCartDiscount();
      }

      function checkout(){
        if (!app.cart.length) {
          toast('Keranjang masih kosong');
          return;
        }

        let subtotal = 0;
        const items = app.cart.map(function(item){
          const product = productById(item.id);
          if (!product) return null;
          const qty = Number(item.qty || 0);
          if (qty <= 0) return null;
          if (qty > Number(product.stock || 0)) {
            toast('Stok ' + product.name + ' tidak cukup');
            return 'blocked';
          }
          subtotal += qty * Number(product.price || 0);
          product.stock = Number(product.stock || 0) - qty;
          return { productId: product.id, name: product.name, qty: qty, price: Number(product.price || 0) };
        });

        if (items.includes('blocked')) return;

        const taxRate = Number(app.state.settings.tax || 0) / 100;
        const discount = Number(app.discount || 0);
        const total = subtotal + subtotal * taxRate - discount;
        const sale = {
          id: uid(),
          createdAt: new Date().toISOString(),
          items: items.filter(Boolean),
          subtotal: subtotal,
          discount: discount,
          tax: subtotal * taxRate,
          total: total,
          payment: 'cash',
          note: ''
        };

        app.state.sales.push(sale);
        app.cart = [];
        app.discount = 0;
        saveState();
        toast('Transaksi berhasil disimpan');
        renderMain();
      }

      function handleProductSubmit(event){
        event.preventDefault();
        const form = event.target;
        const id = form.dataset.id || uid();
        const payload = {
          id: id,
          name: form.querySelector('[name="name"]').value.trim(),
          sku: form.querySelector('[name="sku"]').value.trim(),
          price: Number(form.querySelector('[name="price"]').value || 0),
          stock: Number(form.querySelector('[name="stock"]').value || 0),
          category: form.querySelector('[name="category"]').value.trim() || 'Umum',
          active: form.querySelector('[name="active"]').checked
        };

        if (!payload.name) {
          toast('Nama produk wajib diisi');
          return;
        }

        const idx = app.state.products.findIndex(function(p){ return p.id === id; });
        if (idx >= 0) {
          app.state.products[idx] = Object.assign(app.state.products[idx], payload);
        } else {
          app.state.products.unshift(payload);
        }

        saveState();
        form.reset();
        delete app.productDraft;
        renderMain();
        toast('Produk disimpan');
      }

      function editProduct(productId){
        app.productDraft = productById(productId);
        renderMain();
      }

      function deleteProduct(productId){
        const product = productById(productId);
        if (!product) return;
        app.state.products = app.state.products.filter(function(p){ return p.id !== productId; });
        app.cart = app.cart.filter(function(item){ return item.id !== productId; });
        saveState();
        renderMain();
        toast('Produk dihapus');
      }

      function addStock(productId, qty){
        const product = productById(productId);
        if (!product) return;
        const value = Number(qty || 0);
        if (value <= 0) {
          toast('Jumlah masuk stok harus > 0');
          return;
        }
        product.stock = Number(product.stock || 0) + value;
        const day = dayKey(new Date());
        app.state.days[day] = app.state.days[day] || { recv: {}, sold: {} };
        app.state.days[day].recv[productId] = (app.state.days[day].recv[productId] || 0) + value;
        saveState();
        renderMain();
        toast('Stok ditambahkan');
      }

      function saveSettings(event){
        event.preventDefault();
        const form = event.target;
        app.state.settings.name = form.querySelector('[name="name"]').value.trim() || 'Toko Saya';
        app.state.settings.tax = Number(form.querySelector('[name="tax"]').value || 0);
        app.state.settings.waNo = form.querySelector('[name="waNo"]').value.trim();
        app.state.settings.kontak = form.querySelector('[name="kontak"]').value.trim();
        app.state.settings.theme = form.querySelector('[name="theme"]').value || 'light';
        saveState();
        applyTheme();
        renderMain();
        toast('Pengaturan tersimpan');
      }

      function backupData(){
        const blob = new Blob([JSON.stringify(app.state, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'omnipos-backup.json';
        a.click();
        URL.revokeObjectURL(url);
        toast('Backup dibuat');
      }

      function restoreData(event){
        const input = event.target;
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(){
          try {
            const parsed = JSON.parse(reader.result);
            app.state = Object.assign(defaultState(), parsed);
            app.cart = [];
            app.discount = 0;
            saveState();
            applyTheme();
            renderMain();
            toast('Data berhasil dipulihkan');
          } catch (err) {
            toast('File backup tidak valid');
          } finally {
            input.value = '';
          }
        };
        reader.readAsText(file);
      }

      function resetData(){
        if (!confirm('Reset semua data? Data yang tersimpan akan hilang.')) return;
        app.state = defaultState();
        app.cart = [];
        app.discount = 0;
        saveState();
        applyTheme();
        renderMain();
        toast('Data direset');
      }

      function buildKasirPage(){
        const products = (app.state.products || []).filter(function(p){
          const q = String(app.filter || '').toLowerCase();
          if (!q) return p.active !== false;
          return p.active !== false && (
            (p.name || '').toLowerCase().includes(q) ||
            (p.sku || '').toLowerCase().includes(q) ||
            (p.category || '').toLowerCase().includes(q)
          );
        });

        const subtotal = getCartSubtotal();
        const tax = getCartTax();
        const discount = getCartDiscount();
        const total = subtotal + tax - discount;

        return `
          <section class="card">
            <div class="row">
              <div>
                <h2>Kasir</h2>
              </div>
              <div class="pill">${esc(app.state.settings.name || 'Toko Saya')}</div>
            </div>
            <div class="kpis">
              <div class="kpi"><span class="muted">Omset Hari Ini</span><strong>${money(app.state.sales.reduce(function(sum, sale){ return sum + Number(sale.total || 0); }, 0))}</strong></div>
              <div class="kpi"><span class="muted">Transaksi</span><strong>${app.state.sales.length}</strong></div>
              <div class="kpi"><span class="muted">Produk Aktif</span><strong>${(app.state.products || []).filter(p => p.active !== false).length}</strong></div>
              <div class="kpi"><span class="muted">Stok Rendah</span><strong>${(app.state.products || []).filter(p => Number(p.stock || 0) <= 5).length}</strong></div>
            </div>
          </section>

          <section class="card">
            <div class="row">
              <div style="width:100%">
                <input id="product-search" type="search" value="${esc(app.filter)}" placeholder="Cari produk / SKU / kategori" aria-label="Cari produk" />
              </div>
            </div>
            <div class="catalog">
              ${products.map(function(product){
                const disabled = Number(product.stock || 0) <= 0 || product.active === false;
                return `<button type="button" data-action="add-cart" data-id="${product.id}" ${disabled ? 'disabled' : ''}>
                  <strong>${esc(product.name)}</strong><br>
                  <small>${esc(product.category || 'Umum')}</small>
                  <small>${money(product.price)}</small>
                  <small>Stok: ${Number(product.stock || 0)}</small>
                </button>`;
              }).join('') || '<div class="muted">Tidak ada produk yang cocok.</div>'}
            </div>
          </section>

          <section class="card">
            <div class="row">
              <h3>Keranjang</h3>
              <button type="button" class="btn2" data-action="clear-cart">Kosongkan</button>
            </div>
            <div class="stack">
              ${app.cart.length ? app.cart.map(function(item){
                const product = productById(item.id);
                return `
                  <div class="cart-item">
                    <div>
                      <div><strong>${esc(item.name)}</strong></div>
                      <div class="muted">${money(item.price)} / item</div>
                    </div>
                    <div>
                      <div class="cart-actions">
                        <button type="button" class="circle" data-action="cart-minus" data-id="${item.id}" aria-label="Kurangi">−</button>
                        <strong>${item.qty}</strong>
                        <button type="button" class="circle" data-action="cart-plus" data-id="${item.id}" aria-label="Tambah">+</button>
                        <button type="button" class="circle" data-action="cart-remove" data-id="${item.id}" aria-label="Hapus">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('') : '<div class="muted">Keranjang masih kosong.</div>'}
            </div>

            <div class="totals">
              <div class="row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>
              <div class="row"><span>Diskon</span><input type="number" min="0" step="1000" value="${Number(app.discount || 0)}" data-role="discount" aria-label="Diskon" /></div>
              <div class="row"><span>Pajak</span><strong>${money(tax)}</strong></div>
              <div class="row"><span>Total</span><strong class="grand">${money(total)}</strong></div>
              <div class="row"><span>Pembayaran</span>
                <select data-role="payment-type">
                  <option value="cash">Cash</option>
                  <option value="transfer">Transfer</option>
                  <option value="lainnya">Lainnya</option>
                </select>
              </div>
              <button type="button" class="btn" data-action="checkout">Selesaikan Transaksi</button>
            </div>
          </section>
        `;
      }

      function buildProdukPage(){
        const draft = app.productDraft || { id: '', name: '', sku: '', price: '', stock: '', category: '', active: true };
        return `
          <section class="card">
            <h2>Produk</h2>
            <form data-form="product" data-id="${esc(draft.id || '')}">
              <div class="grid">
                <label>Nama<input name="name" value="${esc(draft.name || '')}" required /></label>
                <label>SKU<input name="sku" value="${esc(draft.sku || '')}" /></label>
                <label>Harga<input type="number" min="0" name="price" value="${Number(draft.price || 0)}" /></label>
                <label>Stok<input type="number" min="0" name="stock" value="${Number(draft.stock || 0)}" /></label>
                <label>Kategori<input name="category" value="${esc(draft.category || '')}" /></label>
                <label style="justify-content:center">
                  <span class="muted">Aktif</span>
                  <input type="checkbox" name="active" ${draft.active === false ? '' : 'checked'} />
                </label>
              </div>
              <div class="row" style="margin-top:.8rem">
                <button type="submit" class="btn">${draft.id ? 'Simpan Perubahan' : 'Tambah Produk'}</button>
                ${draft.id ? '<button type="button" class="btn2" data-action="cancel-product">Batal</button>' : ''}
              </div>
            </form>
          </section>

          <section class="card">
            <h3>Daftar Produk</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Produk</th><th>SKU</th><th>Harga</th><th>Stok</th><th>Kategori</th><th>Aksi</th></tr></thead>
                <tbody>
                  ${(app.state.products || []).map(function(p){ return `
                    <tr>
                      <td>${esc(p.name)}</td>
                      <td>${esc(p.sku || '-')}</td>
                      <td>${money(p.price)}</td>
                      <td class="${Number(p.stock || 0) <= 5 ? 'danger' : ''}">${Number(p.stock || 0)}</td>
                      <td>${esc(p.category || 'Umum')}</td>
                      <td>
                        <button type="button" class="btn2" data-action="edit-product" data-id="${p.id}">Edit</button>
                        <button type="button" class="btn2" data-action="delete-product" data-id="${p.id}">Hapus</button>
                        <button type="button" class="btn2" data-action="add-stock" data-id="${p.id}">+ Stok</button>
                      </td>
                    </tr>
                  `; }).join('') || '<tr><td colspan="6" class="muted">Belum ada produk.</td></tr>'}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }

      function buildStokPage(){
        const products = app.state.products || [];
        const today = dayKey(new Date());
        const daily = app.state.days[today] || { recv: {}, sold: {} };

        return `
          <section class="card">
            <h2>Stok</h2>
            <div class="kpis">
              <div class="kpi"><span class="muted">Total Produk</span><strong>${products.length}</strong></div>
              <div class="kpi"><span class="muted">Unit Tersedia</span><strong>${products.reduce((sum, p) => sum + Number(p.stock || 0), 0)}</strong></div>
              <div class="kpi"><span class="muted">Masuk Hari Ini</span><strong>${Object.values(daily.recv || {}).reduce((sum, v) => sum + Number(v || 0), 0)}</strong></div>
            </div>
          </section>

          <section class="card">
            <h3>Kelola Stok</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Produk</th><th>Stok</th><th>Masuk Hari Ini</th><th>Tambah</th></tr></thead>
                <tbody>
                  ${products.map(function(p){
                    const n = Number(daily.recv[p.id] || 0);
                    return `
                      <tr>
                        <td>${esc(p.name)}</td>
                        <td class="${Number(p.stock || 0) <= 5 ? 'danger' : ''}">${Number(p.stock || 0)}</td>
                        <td>${n}</td>
                        <td>
                          <input type="number" min="1" step="1" value="1" data-stock-product="${p.id}" style="max-width:100px;display:inline-block;" />
                          <button type="button" class="btn2" data-action="stock-add" data-id="${p.id}">Tambah</button>
                        </td>
                      </tr>
                    `;
                  }).join('') || '<tr><td colspan="4" class="muted">Belum ada produk.</td></tr>'}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }

      function buildLaporanPage(){
        const sales = app.state.sales || [];
        const totalRevenue = sales.reduce(function(sum, s){ return sum + Number(s.total || 0); }, 0);
        const totalItems = sales.reduce(function(sum, s){ return sum + (s.items || []).reduce(function(t, i){ return t + Number(i.qty || 0); }, 0); }, 0);
        const today = dayKey(new Date());
        const todaySales = sales.filter(s => dayKey(s.createdAt) === today);

        return `
          <section class="card">
            <h2>Laporan</h2>
            <div class="kpis">
              <div class="kpi"><span class="muted">Total Pendapatan</span><strong>${money(totalRevenue)}</strong></div>
              <div class="kpi"><span class="muted">Total Penjualan</span><strong>${sales.length}</strong></div>
              <div class="kpi"><span class="muted">Item Terjual</span><strong>${totalItems}</strong></div>
              <div class="kpi"><span class="muted">Hari Ini</span><strong>${money(todaySales.reduce((sum, s) => sum + Number(s.total || 0), 0))}</strong></div>
            </div>
          </section>

          <section class="card">
            <h3>Riwayat Penjualan</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Waktu</th><th>Item</th><th>Subtotal</th><th>Total</th></tr></thead>
                <tbody>
                  ${sales.slice().reverse().map(function(s){
                    const items = (s.items || []).map(i => `${esc(i.name)} x${i.qty}`).join(', ');
                    return `<tr><td>${new Date(s.createdAt).toLocaleString('id-ID')}</td><td>${esc(items)}</td><td>${money(s.subtotal || 0)}</td><td>${money(s.total || 0)}</td></tr>`;
                  }).join('') || '<tr><td colspan="4" class="muted">Belum ada transaksi.</td></tr>'}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }

      function buildSetPage(){
        return `
          <section class="card">
            <h2>Pengaturan</h2>
            <form id="settings-form" data-form="settings">
              <div class="grid">
                <label>Nama Toko<input name="name" value="${esc(app.state.settings.name || '')}" /></label>
                <label>Nomor WA<input name="waNo" value="${esc(app.state.settings.waNo || '')}" /></label>
                <label>Kontak<input name="kontak" value="${esc(app.state.settings.kontak || '')}" /></label>
                <label>Pajak (%)<input type="number" name="tax" min="0" value="${Number(app.state.settings.tax || 0)}" /></label>
                <label>Tema<select name="theme"><option value="light" ${app.state.settings.theme === 'light' ? 'selected' : ''}>Light</option><option value="dark" ${app.state.settings.theme === 'dark' ? 'selected' : ''}>Dark</option><option value="system" ${app.state.settings.theme === 'system' ? 'selected' : ''}>System</option></select></label>
              </div>
              <div class="row" style="margin-top:.8rem">
                <button type="submit" class="btn">Simpan</button>
                <button type="button" class="btn2" data-action="backup-data">Backup</button>
                <button type="button" class="btn2" data-action="reset-data">Reset Data</button>
              </div>
            </form>
          </section>

          <section class="card">
            <h3>Restore Data</h3>
            <input type="file" accept="application/json" data-role="restore-file" />
          </section>
        `;
      }

      function renderMain(){
        const main = document.getElementById('main');
        if (!main) return;
        const views = {
          kasir: buildKasirPage,
          stok: buildStokPage,
          produk: buildProdukPage,
          laporan: buildLaporanPage,
          set: buildSetPage
        };
        main.innerHTML = (views[app.view] || buildKasirPage)();

        const search = document.getElementById('product-search');
        if (search) {
          search.addEventListener('input', function(e){
            app.filter = e.target.value;
            renderMain();
          });
        }

        const discountInput = document.querySelector('[data-role="discount"]');
        if (discountInput) {
          discountInput.addEventListener('input', function(e){
            app.discount = Math.max(0, Number(e.target.value || 0));
            renderMain();
          });
        }

        const restoreFile = document.querySelector('[data-role="restore-file"]');
        if (restoreFile) {
          restoreFile.addEventListener('change', restoreData);
        }

        document.querySelectorAll('[data-action]').forEach(function(btn){
          const action = btn.getAttribute('data-action');
          if (!action) return;
          btn.onclick = function(){
            if (action === 'add-cart') {
              addToCart(btn.getAttribute('data-id'));
            } else if (action === 'clear-cart') {
              app.cart = [];
              app.discount = 0;
              renderMain();
            } else if (action === 'cart-plus') {
              changeCartQty(btn.getAttribute('data-id'), 1);
            } else if (action === 'cart-minus') {
              changeCartQty(btn.getAttribute('data-id'), -1);
            } else if (action === 'cart-remove') {
              app.cart = app.cart.filter(function(item){ return item.id !== btn.getAttribute('data-id'); });
              renderMain();
            } else if (action === 'checkout') {
              checkout();
            } else if (action === 'edit-product') {
              editProduct(btn.getAttribute('data-id'));
            } else if (action === 'delete-product') {
              deleteProduct(btn.getAttribute('data-id'));
            } else if (action === 'cancel-product') {
              app.productDraft = null;
              renderMain();
            } else if (action === 'add-stock') {
              const input = document.querySelector('[data-stock-product="' + btn.getAttribute('data-id') + '"]');
              const qty = Number(input ? input.value : 0);
              addStock(btn.getAttribute('data-id'), qty);
            } else if (action === 'backup-data') {
              backupData();
            } else if (action === 'reset-data') {
              resetData();
            }
          };
        });

        const productForm = document.querySelector('[data-form="product"]');
        if (productForm) {
          productForm.addEventListener('submit', handleProductSubmit);
        }

        const settingsForm = document.querySelector('[data-form="settings"]');
        if (settingsForm) {
          settingsForm.addEventListener('submit', saveSettings);
        }
      }

      function applyTheme(){
        const theme = app.state.settings.theme || 'light';
        if (theme === 'system') {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        const btn = document.getElementById('theme-toggle');
        if (btn) {
          const activeTheme = (app.state.settings.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : (app.state.settings.theme || 'light');
          btn.textContent = activeTheme === 'dark' ? '☀️' : '🌙';
        }
      }

      function toggleNav(){
        const nav = document.getElementById('nav');
        const btn = document.getElementById('nav-toggle');
        if (!nav || !btn) return;
        nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(nav.classList.contains('open')));
        btn.textContent = nav.classList.contains('open') ? '✕' : '☰';
      }

      function toggleTheme(){
        const choices = ['light', 'dark', 'system'];
        const current = app.state.settings.theme || 'light';
        const next = choices[(choices.indexOf(current) + 1) % choices.length];
        app.state.settings.theme = next;
        saveState();
        applyTheme();
      }

      function renderNav(){
        const nav = document.getElementById('nav');
        if (!nav) return;
        const tabs = [
          { key: 'kasir', label: 'Kasir' },
          { key: 'stok', label: 'Stok' },
          { key: 'produk', label: 'Produk' },
          { key: 'laporan', label: 'Laporan' },
          { key: 'set', label: 'Pengaturan' }
        ];
        nav.innerHTML = tabs.map(function(tab){
          return '<button type="button" class="' + (app.view === tab.key ? 'on' : '') + '" data-view="' + tab.key + '">' + tab.label + '</button>';
        }).join('');

        nav.querySelectorAll('[data-view]').forEach(function(btn){
          btn.addEventListener('click', function(){
            app.view = btn.getAttribute('data-view');
            renderNav();
            renderMain();
          });
        });
      }

      function init(){
        loadState();
        applyTheme();
        renderNav();
        renderMain();
      }

      window.app = {
        view: app.view,
        toggleNav: toggleNav,
        toggleTheme: toggleTheme,
        go: function(name){ app.view = name; renderNav(); renderMain(); }
      };

      init();
    })();
  </script>
</body>
</html>

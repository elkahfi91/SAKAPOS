<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniPOS</title><style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mu:#7a746b;--card:#fff;--ln:#e6e1d8;--ac:#b4411f;--on:#fff;--gr:#16863f;color-scheme:light}
:root[data-theme=dark]{--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;--gr:#4ade80;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;--gr:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,#brand{font-family:Georgia,serif;font-weight:700}h2{font-size:2rem;margin:.2em 0 .6em}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
#brand{font-size:1.4rem;color:var(--ac)}main{max-width:1200px;margin:auto;padding:1rem 1.2rem 4rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
input,select{padding:.6rem;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac)}
.search{width:100%;margin-bottom:.8rem}
.btn,.btn2{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer;font:inherit;min-height:42px}
.btn2{background:none;color:var(--ac)}.sm{padding:.2rem .5rem;min-height:0;font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:.8rem;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1rem}
.kpi div{border-left:3px solid var(--ac);padding-left:.8rem}.kpi small{color:var(--mu);display:block}.kpi b{font:700 1.7rem Georgia,serif}
.pos{display:grid;grid-template-columns:1fr 360px;gap:1rem}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.pg button{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:.7rem;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-height:70px}
.pg button:disabled{opacity:.4}.pg small{color:var(--mu);display:block}
.tot{font:700 2.2rem Georgia,serif;color:var(--ac)}.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.3rem 0}
.low{color:var(--ac);font-weight:600}.mu{color:var(--mu)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:4px;display:none;z-index:9}
#th{margin-left:auto;min-height:36px;padding:.3rem .8rem}
form label{display:grid;gap:.25rem;color:var(--mu);font-size:.8rem}
.sum td{border-top:2px solid var(--fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chips .on{background:var(--ac);color:var(--on)}
header{flex-wrap:nowrap;gap:.6rem}header #brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:0;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:4px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:30}#ov.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--card);border-right:1px solid var(--ln);z-index:31;transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s}
#drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem .4rem 1.2rem;border-bottom:1px solid var(--ln);font:700 1.2rem Georgia,serif}
#nav{display:flex;flex-direction:column;padding:.5rem 0}
#nav button{background:none;border:0;border-left:3px solid transparent;color:var(--mu);padding:.9rem 1.2rem;text-align:left;cursor:pointer;font:inherit;font-size:1.05rem}
#nav button.on{color:var(--fg);border-left-color:var(--ac);background:var(--bg);font-weight:600}
#rcpt{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;overflow:auto;padding:1rem}#rcpt.show{display:block}
#rcpt .acts{display:flex;gap:.5rem;justify-content:center;margin:0 auto .8rem;max-width:320px}#rcpt .acts button{flex:1}
.paper{background:#fff;color:#000;width:100%;max-width:320px;margin:0 auto;padding:18px 14px;font:12px/1.45 'Courier New',Courier,monospace;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.paper .c{text-align:center}
.paper .ttl{margin:0 0 4px;font:900 24px/1.15 'Courier New',Courier,monospace;letter-spacing:.04em;text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.paper .addr{text-align:center;font-size:11px;overflow-wrap:anywhere}
.paper .r{display:flex;justify-content:space-between;gap:10px}.paper .r span:last-child{text-align:right;white-space:nowrap}
.paper hr{border:0;border-top:1px dashed #000;margin:8px 0}
.paper .b{font-weight:700}
.paper .it{display:grid;grid-template-columns:minmax(0,1fr) 3ch 8ch 9ch;gap:0 6px;align-items:start}
.paper .it>span:nth-child(1){text-align:left;overflow-wrap:anywhere}
.paper .it>span:nth-child(2){text-align:center}
.paper .it>span:nth-child(n+3){text-align:right;white-space:nowrap}
.paper .ith{font-weight:700;font-size:11px;text-transform:uppercase}
.paper .gt{text-align:right}.paper .gt small{display:block;font-size:11px;letter-spacing:.12em}
.paper .gt b{display:block;font:900 26px/1.15 'Courier New',Courier,monospace;white-space:nowrap}
.ph{display:flex;align-items:center;gap:.4rem 1rem;flex-wrap:wrap;margin-bottom:.4rem}.ph h2{margin:.2em 0}
.seg{display:inline-flex;gap:.3rem}.seg .sm{min-height:36px;padding:.3rem .8rem}.seg .on{background:var(--ac);color:var(--on)}
.t2tot{font:700 clamp(2.8rem,14vw,5rem)/1.1 Georgia,serif;color:var(--gr);text-align:center;margin:.4rem 0 0;overflow-wrap:anywhere}
.t2sub{text-align:center;margin-bottom:.8rem;min-height:2rem}
.pg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem;margin:.6rem 0 .5rem}
.tile{position:relative}
.tile .tmain{width:100%;min-height:96px;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:.8rem;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:.1rem}
.tile .tmain b{font-size:1.05rem}.tile small{color:var(--mu)}
.tile.sel .tmain{border-color:var(--gr)}.tile .tmain:disabled{opacity:.5;cursor:default}
.badge{position:absolute;top:-8px;right:-6px;min-width:28px;height:28px;border-radius:14px;background:var(--gr);color:var(--on);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.minus{position:absolute;bottom:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font-size:1.2rem;cursor:pointer}
.t2bar{position:sticky;bottom:0;padding:.7rem 0 calc(.7rem + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.t2go{width:100%;min-height:52px;font-size:1.15rem;background:var(--gr);border-color:var(--gr);color:var(--on)}.t2go:disabled{opacity:.45;cursor:default}
#pay2{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}#pay2.show{display:flex}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:460px;border-radius:14px 14px 0 0;padding:1.1rem;max-height:94vh;overflow:auto;display:grid;gap:.6rem}
.sheet .chips{justify-content:flex-start}.sheet .chips .on{background:var(--gr);border-color:var(--gr);color:var(--on)}
@media(min-width:600px){#pay2{align-items:center}.sheet{border-radius:14px}}
#pay2.mid{align-items:center}#pay2.mid .sheet{border-radius:14px;margin:0 1rem;text-align:center}
.py-items{max-height:26vh;overflow:auto;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.py-fx{display:flex;justify-content:space-between;align-items:baseline;margin-top:.5rem;font-size:1.1rem}.py-fx b{font-size:1.6rem}
.chg{font:700 clamp(3rem,18vw,5.5rem)/1.1 Georgia,serif;color:var(--gr);overflow-wrap:anywhere}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{position:static;display:block;background:none;padding:0;overflow:visible}#rcpt .acts{display:none}.paper{box-shadow:none;max-width:none;width:72mm;padding:0;margin:0}@page{size:80mm auto;margin:4mm}}
</style></head>
<body>
<header><button id="mb" class="ib" aria-label="Buka menu" aria-expanded="false" aria-controls="drawer" onclick="App.menu(true)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><b id="brand">OmniPOS</b><button id="th" class="btn2" onclick="App.theme()" aria-label="Ganti tema"></button></header>
<div id="ov" onclick="App.menu(false)"></div>
<aside id="drawer" aria-label="Menu utama" aria-hidden="true"><div class="dh"><b>Menu</b><button class="ib" onclick="App.menu(false)" aria-label="Tutup menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><nav id="nav"></nav></aside>
<main id="main"></main><div id="toast"></div><div id="rcpt" role="dialog" aria-label="Struk"></div><div id="pay2"></div>
<script>
window.App={views:{},after:{}};
App.canStore=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
(function(A){
const K='omnipos_v1';
let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
A.db=d||{products:[],sales:[],days:{},settings:{name:'Toko Saya',tax:0,seq:0}};
A.save=()=>{try{localStorage.setItem(K,JSON.stringify(A.db))}catch(e){A.toast('Gagal menyimpan: '+e.message)}};
A.id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
A.rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
A.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
A.$=id=>document.getElementById(id);
A.toast=m=>{const t=A.$('toast');t.textContent=m;t.style.display='block';clearTimeout(A._t);A._t=setTimeout(()=>t.style.display='none',2500)};
A.prod=id=>A.db.products.find(p=>p.id===id);
A.download=(name,text,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;a.click()};
// Data lama (riwayat stok/ledger) dibuang; stok kini per hari: days[tanggal].recv[produk] = barang diterima
A.migrate=()=>{const D=A.db;D.days=D.days||{};D.products=D.products||[];D.sales=D.sales||[];D.settings=D.settings||{name:'Toko Saya',tax:0,seq:0};delete D.moves;
D.products.forEach(p=>{delete p.opening;delete p.hist;delete p.min;delete p.cost});
Object.values(D.days).forEach(x=>{if(Array.isArray(x.xfer))x.xfer=x.xfer.filter(e=>e.type!=='retur').map(e=>e.type==='transfer'?Object.assign({},e,{type:'keluar'}):e)})};
A.migrate();
A.dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
A.recv=(day,pid)=>{const r=(A.db.days[day]||{}).recv;return r&&pid in r?r[pid]:null};
A.sold=(day,pid)=>A.db.sales.reduce((a,s)=>s.status==='done'&&A.dk(s.at)===day?a+s.items.filter(i=>i.pid===pid).reduce((x,i)=>x+i.qty,0):a,0);
A.xq=(day,pid,type)=>((A.db.days[day]||{}).xfer||[]).reduce((a,x)=>x.type===type?a+(x.items[pid]||0):a,0);
A.inn=(day,pid)=>A.xq(day,pid,'masuk');A.out=(day,pid)=>A.xq(day,pid,'keluar');
A.sisa=(day,pid)=>{const r=A.recv(day,pid),m=A.inn(day,pid);return r===null&&!m?null:(r||0)+m-A.sold(day,pid)-A.out(day,pid)};
})(App);

</script>
<script>
(function(A){
let edit=null;
A.views.produk=()=>{const p=edit?A.prod(edit):{};
return `<h2>Produk</h2><form class="card grid" onsubmit="App.pSave(event)">
<label>Nama produk<input name=name required value="${A.esc(p.name)}"></label>
<label>Harga jual<input name=price type=number min=0 step=1 required value="${p.price??''}"></label>
<button class=btn>${edit?'Simpan':'Tambah'}</button>${edit?'<button type=button class=btn2 onclick="App.pEdit(null)">Batal</button>':''}</form><div id=plist class=tw></div>`};
A.after.produk=()=>{const r=A.db.products.filter(p=>!p.archived);
A.$('plist').innerHTML=r.length?`<table><tr><th>Produk<th>Harga<th></tr>${r.map(p=>`<tr><td>${A.esc(p.name)}<td>${A.rp(p.price)}<td><button class="btn2 sm" onclick="App.pEdit('${p.id}')">Ubah</button> <button class="btn2 sm" onclick="App.pArch('${p.id}')">Hapus</button></tr>`).join('')}</table>`:'<p class=mu>Belum ada produk. Tambahkan dulu, atau pakai "Isi contoh" di Pengaturan.</p>'};
A.pEdit=id=>{edit=id;A.go('produk')};
A.pSave=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),price=Math.floor(+f.get('price'));
if(!name||!(price>=0))return A.toast('Data tidak valid');
if(edit)Object.assign(A.prod(edit),{name,price});else A.db.products.push({id:A.id(),name,price,archived:false});
edit=null;A.save();A.toast('Tersimpan');A.go('produk')};
A.pArch=id=>{if(confirm('Hapus produk dari daftar? Riwayat penjualan tetap aman.')){A.prod(id).archived=true;A.save();A.go('produk')}};
})(App);

</script>
<script>
(function(A){
const last=(day,pid)=>{const ks=Object.keys(A.db.days).filter(k=>k<day).sort();for(let i=ks.length-1;i>=0;i--){const r=A.db.days[ks[i]].recv;if(r&&pid in r)return r[pid]}return''};
A.views.terima=()=>{const day=A.dk(Date.now()),ps=A.db.products.filter(p=>!p.archived);
return `<h2>Barang Diterima</h2><p class=mu>Isi sekali per hari: jumlah yang diterima kasir hari ini. Isian awal mengikuti hari sebelumnya, ubah bila berbeda.</p>
<form class=card onsubmit="App.tSave(event)">${ps.map(p=>{const v=A.recv(day,p.id);return`<div class=row><span>${A.esc(p.name)}${v===null?'':' <small class=mu>(sudah diisi)</small>'}</span><input name="r_${p.id}" type=number min=0 step=1 placeholder="0" style="width:110px" value="${v===null?last(day,p.id):v}"></div>`}).join('')||'<p class=mu>Belum ada produk.</p>'}<button class=btn>Simpan</button></form>`};
A.tSave=e=>{e.preventDefault();const f=new FormData(e.target),day=A.dk(Date.now()),r={};
for(const p of A.db.products.filter(p=>!p.archived)){const v=f.get('r_'+p.id);if(v===''||v===null)continue;const q=Math.floor(+v);
if(!(q>=0))return A.toast('Jumlah tidak valid');const used=A.sold(day,p.id)+A.out(day,p.id)-A.inn(day,p.id);if(q<used)return A.toast(p.name+': kurang dari yang sudah terjual/keluar ('+used+')');r[p.id]=q}
A.db.days[day]=A.db.days[day]||{};A.db.days[day].recv=Object.assign(A.db.days[day].recv||{},r);A.save();A.toast('Tersimpan');A.go('pos')};
const base=A.views.terima,hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
A.views.terima=()=>{const day=A.dk(Date.now()),E=A.esc,ps=A.db.products.filter(p=>!p.archived),xf=(A.db.days[day]||{}).xfer||[];
const nm=pid=>{const p=A.prod(pid);return p?E(p.name):'?'};
return base()+`<h2 style="margin-top:2rem">Transfer Produk</h2><p class=mu>Barang masuk = tambahan stok untuk dijual. Barang keluar = stok berlebih yang dikeluarkan untuk dijual di tempat lain, jadi mengurangi stok hari ini. Isi hanya produk yang berubah.</p>
<form class=card onsubmit="App.xfSave(event)">${ps.length?`<div class="row mu" style="font-size:.8rem"><span>Produk</span><span style="display:flex;gap:.5rem"><span style="width:72px;text-align:center">Masuk (+)</span><span style="width:72px;text-align:center">Keluar (−)</span></span></div>${ps.map(p=>{const s=A.sisa(day,p.id);return`<div class=row><span>${E(p.name)} <small class=mu>(${s===null?'belum diterima':'sisa '+s})</small></span><span style="display:flex;gap:.5rem"><input name="m_${p.id}" type=number min=0 step=1 placeholder="0" style="width:72px" aria-label="Masuk ${E(p.name)}"><input name="k_${p.id}" type=number min=0 step=1 placeholder="0" style="width:72px" aria-label="Keluar ${E(p.name)}"></span></div>`}).join('')}<label style="margin:.6rem 0">Keterangan (opsional)<input name=note placeholder="mis. dari bos / ke Outlet 2"></label><button class=btn>Simpan transfer</button>`:'<p class=mu>Belum ada produk.</p>'}</form>
${xf.length?`<h3>Riwayat transfer hari ini</h3><div class=card>${xf.map(x=>`<div class=row><span><b>${x.type==='masuk'?'Barang masuk':'Barang keluar'}</b> <small class=mu>${hm(x.at)}${x.note?' · '+E(x.note):''}</small><br><small class=mu>${Object.entries(x.items).map(([k,v])=>nm(k)+' ×'+v).join(', ')}</small></span><button class="btn2 sm" onclick="App.xfUndo('${x.id}')">Batalkan</button></div>`).join('')}</div>`:''}`};
const push=(type,items,note)=>{const day=A.dk(Date.now());A.db.days[day]=A.db.days[day]||{};(A.db.days[day].xfer=A.db.days[day].xfer||[]).push({id:A.id(),at:Date.now(),type,items,note})};
A.xfSave=e=>{e.preventDefault();const f=new FormData(e.target),day=A.dk(Date.now()),note=(f.get('note')||'').trim(),mi={},ko={};
for(const p of A.db.products.filter(p=>!p.archived)){const a=f.get('m_'+p.id),c=f.get('k_'+p.id),m=a===''||a===null?0:Math.floor(+a),k=c===''||c===null?0:Math.floor(+c);
if(!(m>=0)||!(k>=0))return A.toast('Jumlah tidak valid');
const ada=(A.sisa(day,p.id)||0)+m;if(k>ada)return A.toast(p.name+': keluar melebihi stok ('+ada+')');
if(m>0)mi[p.id]=m;if(k>0)ko[p.id]=k}
if(!Object.keys(mi).length&&!Object.keys(ko).length)return A.toast('Isi jumlah masuk atau keluar');
if(Object.keys(mi).length)push('masuk',mi,note);if(Object.keys(ko).length)push('keluar',ko,note);A.save();A.toast('Transfer tersimpan');A.go('terima')};
A.xfUndo=id=>{const day=A.dk(Date.now()),d=A.db.days[day];if(!d||!d.xfer||!confirm('Batalkan catatan ini?'))return;const old=d.xfer;d.xfer=old.filter(x=>x.id!==id);
if(A.db.products.some(p=>(A.recv(day,p.id)||0)+A.inn(day,p.id)-A.sold(day,p.id)-A.out(day,p.id)<0)){d.xfer=old;return A.toast('Tidak bisa dibatalkan: stok sudah terjual')}
A.save();A.go('terima')};
})(App);

</script>
<script>
(function(A){
A.cart=[];A.key=A.id();let q='',disc=0,pay='pas';
const day=()=>A.dk(Date.now());
const tpl=()=>A.db.settings.posTpl===2?2:1;
const hd=()=>`<div class=ph><h2>Kasir</h2><div class=seg role=group aria-label="Template kasir">${[1,2].map(n=>`<button type=button class="btn2 sm ${tpl()===n?'on':''}" aria-pressed="${tpl()===n}" onclick="App.posTpl(${n})">Template ${n}</button>`).join('')}</div></div>`;
A.posTpl=n=>{A.db.settings.posTpl=n;A.save();A.go('pos')};
const sum=()=>{const sub=A.cart.reduce((a,c)=>a+A.prod(c.pid).price*c.qty,0),d=Math.min(disc,sub),tax=Math.round((sub-d)*(A.db.settings.tax||0)/100);return{sub,d,tax,total:sub-d+tax}};
const view1=()=>`<div class=pos><div>${hd()}<input class=search placeholder="Cari produk..." oninput="App.xQ(this.value)"><div id=pg class=pg></div></div>
<div class=card><h3>Keranjang</h3><div id=cl></div>
<div class=row><span>Diskon (Rp)</span><input type=number min=0 style="width:120px" value="${disc||''}" oninput="App.xDisc(this.value)"></div>
<div class=row><span>Metode</span><select id=pm onchange="App.xTot()"><option>Tunai<option>Transfer<option>Lainnya</select></div>
<div id=cw><div class=row><span>Uang diterima</span></div><div class=chips id=cb></div><input id=cash type=number min=0 placeholder="Masukkan nominal uang diterima" style="display:${pay==='manual'?'block':'none'};width:100%;margin-top:.4rem" oninput="App.xTot()"></div>
<div id=tt></div><button class=btn style="width:100%;margin-top:.6rem" id=co onclick="App.checkout()">Bayar</button></div></div>`;
const grid=()=>{const r=A.db.products.filter(p=>!p.archived&&p.name.toLowerCase().includes(q.toLowerCase()));
A.$('pg').innerHTML=r.map(p=>{const s=A.sisa(day(),p.id);return`<button ${!s||s<=0?'disabled':''} onclick="App.xAdd('${p.id}')"><b>${A.esc(p.name)}</b><small>${A.rp(p.price)} · ${s===null?'belum diterima':'sisa '+s}</small></button>`}).join('')||'<p class=mu>Belum ada produk.</p>'};
const cart=()=>{A.$('cl').innerHTML=A.cart.map((c,i)=>{const p=A.prod(c.pid);return`<div class=row><span>${A.esc(p.name)}<br><small class=mu>${A.rp(p.price)}</small></span><span><input type=number min=1 max=${A.sisa(day(),p.id)} value=${c.qty} style="width:64px" onchange="App.xQty(${i},this.value)"> <button class="btn2 sm" onclick="App.xDel(${i})" aria-label="Hapus">✕</button></span></div>`}).join('')||'<p class=mu>Kosong</p>';A.xTot()};
const chips=()=>{A.$('cb').innerHTML=[['pas','Uang pas'],[20000,'20rb'],[50000,'50rb'],[100000,'100rb'],['manual','Lainnya']].map(([v,t])=>`<button type=button class="btn2 ${pay===v?'on':''}" onclick="App.xPay('${v}')">${t}</button>`).join('')};
const cashAmt=t=>pay==='pas'?t.total:pay==='manual'?(+A.$('cash').value||0):pay;
A.xPay=v=>{pay=(v==='pas'||v==='manual')?v:+v;const i=A.$('cash');i.style.display=pay==='manual'?'block':'none';chips();A.xTot();if(pay==='manual')i.focus()};
A.views.pos=()=>tpl()===2?view2():view1();
A.after.pos=()=>{if(tpl()===2)t2Refresh();else{grid();cart();chips()}};
A.xQ=v=>{q=v;tpl()===2?t2Grid():grid()};
A.xAdd=id=>{const c=A.cart.find(c=>c.pid===id),s=A.sisa(day(),id);if(s===null)return A.toast('Isi barang diterima dulu');if((c?c.qty:0)+1>s)return A.toast('Stok habis');c?c.qty++:A.cart.push({pid:id,qty:1});cart()};
A.xQty=(i,v)=>{const n=Math.floor(+v),s=A.sisa(day(),A.cart[i].pid);if(n>=1&&n<=s)A.cart[i].qty=n;else A.toast('Jumlah tidak valid');cart()};
A.xDel=i=>{A.cart.splice(i,1);cart()};A.xDisc=v=>{disc=Math.max(0,Math.floor(+v)||0);A.xTot()};
A.xTot=()=>{const t=sum(),tunai=A.$('pm').value==='Tunai',c=cashAmt(t);A.$('cw').style.display=tunai?'':'none';A.$('tt').innerHTML=`<div class=row><span>Subtotal</span><span>${A.rp(t.sub)}</span></div><div class=row><span>Diskon</span><span>-${A.rp(t.d)}</span></div><div class=row><span>Pajak</span><span>${A.rp(t.tax)}</span></div><div class=tot>${A.rp(t.total)}</div>${tunai&&c?`<div class=row><span>Kembalian</span><b>${c>=t.total?A.rp(c-t.total):'kurang '+A.rp(t.total-c)}</b></div>`:''}`};
const commit=(m,cash)=>{
if(!A.cart.length){A.toast('Keranjang kosong');return null}
if(A.db.sales.some(s=>s.key===A.key)){A.toast('Transaksi ini sudah tersimpan');return null}
const t=sum();
for(const c of A.cart){const p=A.prod(c.pid),s=p&&A.sisa(day(),c.pid);if(!p||p.archived||s===null||s<c.qty){A.toast('Stok tidak cukup: '+(p?p.name:'?'));return null}}
if(m==='Tunai'&&cash<t.total){A.toast('Uang kurang');return null}
const st=A.db.settings;st.seq=(st.seq||0)+1;
const s={id:A.id(),kasir:st.kasir||'',key:A.key,no:'INV-'+day().replace(/-/g,'')+'-'+String(st.seq).padStart(4,'0'),at:Date.now(),status:'done',method:m,
items:A.cart.map(c=>{const p=A.prod(c.pid);return{pid:p.id,name:p.name,price:p.price,qty:c.qty}}),
sub:t.sub,disc:t.d,tax:t.tax,total:t.total,cash:m==='Tunai'?cash:t.total,change:m==='Tunai'?cash-t.total:0};
A.db.sales.push(s);
A.cart=[];A.key=A.id();disc=0;pay='pas';A.save();return s};
A.checkout=()=>{const t=sum(),s=commit(A.$('pm').value,cashAmt(t));if(!s)return;A.receipt(s);A.go('pos')};

// ===== Template 2: total jumbo hijau -> kotak produk -> Proses -> pembayaran -> kembalian + resi =====
const view2=()=>`<div class=t2>${hd()}<div class=t2tot id=t2tot></div><div class=t2sub id=t2sub></div>
<input class=search placeholder="Cari produk..." value="${A.esc(q)}" oninput="App.xQ(this.value)"><div id=pg2 class=pg2></div>
<div class=t2bar><button class="btn t2go" id=t2go onclick="App.t2Proses()">Proses</button></div></div>`;
const t2Grid=()=>{const r=A.db.products.filter(p=>!p.archived&&p.name.toLowerCase().includes(q.toLowerCase()));
A.$('pg2').innerHTML=r.map(p=>{const s=A.sisa(day(),p.id),c=A.cart.find(c=>c.pid===p.id),n=c?c.qty:0,out=s===null||s-n<=0;
return`<div class="tile${n?' sel':''}"><button class=tmain ${out?'disabled':''} onclick="App.t2Add('${p.id}')"><b>${A.esc(p.name)}</b><small>${A.rp(p.price)}</small><small>${s===null?'belum diterima':'sisa '+(s-n)}</small></button>${n?`<span class=badge>${n}</span><button class=minus onclick="App.t2Sub('${p.id}')" aria-label="Kurangi ${A.esc(p.name)}">−</button>`:''}</div>`}).join('')||'<p class=mu>Belum ada produk.</p>'};
const t2Total=()=>{const t=sum(),n=A.cart.reduce((a,c)=>a+c.qty,0);A.$('t2tot').textContent=A.rp(t.total);
A.$('t2sub').innerHTML=n?`<span class=mu>${n} item${t.tax?' · termasuk pajak':''}</span> <button type=button class="btn2 sm" onclick="App.t2Clear()">Kosongkan</button>`:'<span class=mu>Ketuk produk untuk menambah</span>';A.$('t2go').disabled=!n};
const t2Refresh=()=>{t2Grid();t2Total()};
A.t2Add=id=>{const c=A.cart.find(c=>c.pid===id),s=A.sisa(day(),id);if(s===null)return A.toast('Isi barang diterima dulu');if((c?c.qty:0)+1>s)return A.toast('Stok habis');c?c.qty++:A.cart.push({pid:id,qty:1});t2Refresh()};
A.t2Sub=id=>{const i=A.cart.findIndex(c=>c.pid===id);if(i<0)return;if(--A.cart[i].qty<=0)A.cart.splice(i,1);t2Refresh()};
A.t2Clear=()=>{A.cart=[];disc=0;t2Refresh()};
const PY={m:'Tunai',cash:null};
const cashNow=t=>PY.cash===null?t.total:PY.cash;
const quick=t=>{const set=new Set([t]);[5000,10000,50000,100000].forEach(u=>set.add(Math.ceil(t/u)*u));[20000,50000,100000].forEach(v=>{if(v>=t)set.add(v)});return[...set].sort((a,b)=>a-b).slice(0,5)};
const pyLive=()=>{const t=sum(),tunai=PY.m==='Tunai',c=cashNow(t);
A.$('py-tot').textContent=A.rp(t.total);
A.$('py-m').innerHTML=['Tunai','Transfer','Lainnya'].map(m=>`<button type=button class="btn2 ${PY.m===m?'on':''}" onclick="App.pyM('${m}')">${m}</button>`).join('');
A.$('py-cw').style.display=tunai?'':'none';
A.$('py-q').innerHTML=quick(t.total).map(v=>`<button type=button class="btn2 ${c===v?'on':''}" onclick="App.pyQ(${v})">${v===t.total?'Uang pas':A.rp(v)}</button>`).join('');
A.$('py-fx').innerHTML=tunai?(c>=t.total?`<span>Kembalian</span><b>${A.rp(c-t.total)}</b>`:`<span>Kurang</span><b class=low>${A.rp(t.total-c)}</b>`):'';
A.$('py-bayar').disabled=tunai&&c<t.total};
A.t2Proses=()=>{if(!A.cart.length)return A.toast('Pilih produk dulu');PY.m='Tunai';PY.cash=null;const t=sum(),el=A.$('pay2');el.className='show';
el.innerHTML=`<div class=sheet role=dialog aria-label="Pembayaran"><div class=row><h3 style="margin:0">Pembayaran</h3><button class=ib onclick="App.pyClose()" aria-label="Tutup">✕</button></div>
<div class=py-items>${A.cart.map(c=>{const p=A.prod(c.pid);return`<div class=row><span>${A.esc(p.name)} <small class=mu>× ${c.qty}</small></span><span>${A.rp(p.price*c.qty)}</span></div>`}).join('')}</div>
<div class=row><span>Diskon (Rp)</span><input id=py-disc type=number min=0 style="width:120px" value="${disc||''}" oninput="App.pyDisc(this.value)"></div>
<div class=t2tot id=py-tot style="font-size:clamp(2.2rem,11vw,3.4rem)"></div>
<div class=chips id=py-m></div>
<div id=py-cw><div class=chips id=py-q></div><input id=py-cash type=number min=0 style="width:100%;margin-top:.4rem" placeholder="Uang diterima" value="${t.total}" oninput="App.pyCash(this.value)"><div class=py-fx id=py-fx></div></div>
<button class="btn t2go" id=py-bayar onclick="App.pyBayar()">Bayar</button></div>`;pyLive()};
A.pyM=m=>{PY.m=m;pyLive()};
A.pyQ=v=>{PY.cash=v;A.$('py-cash').value=v;pyLive()};
A.pyCash=v=>{PY.cash=Math.max(0,Math.floor(+v)||0);pyLive()};
A.pyDisc=v=>{disc=Math.max(0,Math.floor(+v)||0);if(PY.cash===null)A.$('py-cash').value=sum().total;pyLive();t2Total()};
A.pyClose=()=>{const el=A.$('pay2');el.className='';el.innerHTML=''};
A.pyBayar=()=>{const t=sum(),tunai=PY.m==='Tunai',s=commit(PY.m,tunai?cashNow(t):t.total);if(!s)return;A.pyClose();A.go('pos');A.receipt(s);if(s.change>0)A.pyChange(s)};
A.pyChange=s=>{const el=A.$('pay2');el.className='show mid';
el.innerHTML=`<div class=sheet role=alertdialog aria-label="Kembalian"><div class=mu>Kembalian</div><div class=chg>${A.rp(s.change)}</div><div class=row><span class=mu>Total</span><span>${A.rp(s.total)}</span></div><div class=row><span class=mu>Diterima</span><span>${A.rp(s.cash)}</span></div><button class="btn t2go" onclick="App.pyClose()">Lihat resi</button></div>`};
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
A.receipt=s=>{const T=A.db.settings,E=A.esc,row=(a,b,c='')=>`<div class="r ${c}"><span>${a}</span><span>${b}</span></div>`,n=v=>Math.round(v).toLocaleString('id-ID');
const soc=[T.ig&&'IG @'+T.ig,T.tiktok&&'TikTok @'+T.tiktok].filter(Boolean).map(x=>`<div>${E(x)}</div>`).join('');
const addr=[T.lokasi&&E(T.lokasi),T.kontak&&'Telp '+E(T.kontak)].filter(Boolean).join(' | ');
A.$('rcpt').innerHTML=`<div class=acts><button class=btn onclick="window.print()">Cetak</button><button class=btn2 onclick="App.rcClose()">Tutup</button></div>
<div class=paper><h4 class=ttl>${E(T.name)}</h4>${addr?`<div class=addr>${addr}</div>`:''}<hr>
${row('Tgl/Jam',fmt(s.at))}${row('No',E(s.no))}${s.kasir?row('Kasir',E(s.kasir)):''}<hr>
<div class="it ith"><span>Produk</span><span>Qty</span><span>Harga</span><span>Total</span></div><hr>
${s.items.map(i=>`<div class=it><span>${E(i.name)}</span><span>${i.qty}</span><span>${n(i.price)}</span><span>${n(i.qty*i.price)}</span></div>`).join('')}<hr>
${row('Subtotal',A.rp(s.sub))}${s.disc?row('Diskon','-'+A.rp(s.disc)):''}${s.tax?row('Pajak',A.rp(s.tax)):''}<hr>
<div class=gt><small>TOTAL</small><b>${A.rp(s.total)}</b></div><hr>
${row(E(s.method),A.rp(s.cash))}${s.method==='Tunai'?row('Kembali',A.rp(s.change)):''}<hr>
<div class=c><div class=b>Terima kasih</div>${soc}</div></div>`;
A.$('rcpt').classList.add('show')};
A.rcClose=()=>A.$('rcpt').classList.remove('show');
})(App);

</script>
<script>
(function(A){
let day=A.dk(Date.now());
const lbl=()=>new Date(day+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
A.views.laporan=()=>`<h2>Laporan Harian</h2><input type=date value="${day}" max="${A.dk(Date.now())}" onchange="App.lD(this.value)"> <button class=btn2 onclick="App.lCsv()">CSV stok</button> <button class=btn2 onclick="App.lCsvJ()">CSV penjualan</button>
<div class=card style="margin-top:1rem"><b>Kirim laporan via WhatsApp</b><div class=grid style="margin-top:.5rem"><input id=wano type=tel placeholder="No. WA tujuan (opsional), mis. 0812..." value="${A.esc(A.db.settings.waNo||'')}"><button class=btn onclick="App.wa()">Kirim WhatsApp</button><button class=btn2 onclick="App.waShare()">Bagikan… (pilih WA / WA Bisnis)</button><button class=btn2 onclick="App.waCopy()">Salin teks</button></div></div><div id=rep></div>`;
const calc=()=>{const ok=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day),by={};ok.forEach(x=>by[x.method]=(by[x.method]||0)+x.total);
const rows=A.db.products.filter(p=>!p.archived||A.recv(day,p.id)!==null||A.sold(day,p.id)>0||A.inn(day,p.id)>0).map(p=>({name:p.name,terima:A.recv(day,p.id),jual:A.sold(day,p.id),sisa:A.sisa(day,p.id),masuk:A.inn(day,p.id),keluar:A.out(day,p.id)}));
const n=v=>v===null?'-':v,tot={terima:rows.reduce((a,r)=>a+(r.terima||0),0),jual:rows.reduce((a,r)=>a+r.jual,0),sisa:rows.reduce((a,r)=>a+(r.sisa||0),0),masuk:rows.reduce((a,r)=>a+r.masuk,0),keluar:rows.reduce((a,r)=>a+r.keluar,0)};
return{ok,by,rows,tot,n,uang:ok.reduce((a,x)=>a+x.total,0)}};
const render=()=>{const r=calc(),n=r.n;A._rep=r;const all=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day).sort((a,b)=>b.at-a.at);
A.$('rep').innerHTML=`<p class=mu>${lbl()}</p><div class=kpi><div><small>Uang diterima</small><b>${A.rp(r.uang)}</b></div><div><small>Transaksi</small><b>${r.ok.length}</b></div><div><small>Total terjual</small><b>${r.tot.jual}</b></div></div>
<p class=mu>${Object.entries(r.by).map(([k,v])=>`${k}: ${A.rp(v)}`).join(' · ')||'Belum ada penjualan pada tanggal ini'}</p>
<h3>Stok hari ini</h3><div class=tw><table><tr><th>Produk<th>Diterima<th>Masuk<th>Terjual<th>Keluar<th>Sisa</tr>${r.rows.map(x=>`<tr><td>${A.esc(x.name)}<td>${n(x.terima)}<td>${x.masuk}<td>${x.jual}<td>${x.keluar}<td><b>${n(x.sisa)}</b></tr>`).join('')}<tr class=sum><td>Total<td>${r.tot.terima}<td>${r.tot.masuk}<td>${r.tot.jual}<td>${r.tot.keluar}<td>${r.tot.sisa}</tr></table></div>
<p class=mu>Sisa = diterima + masuk − terjual − keluar. Transaksi yang di-refund tidak dihitung.</p>
<h3>Riwayat penjualan</h3><div class=tw><table><tr><th>No<th>Waktu<th>Metode<th>Diterima<th></tr>${all.map(s=>`<tr><td>${s.no}<td>${new Date(s.at).toLocaleTimeString('id-ID')}<td>${s.method}<td>${A.rp(s.total)}<td><button class="btn2 sm" onclick="App.lPrint('${s.id}')">Struk</button> <button class="btn2 sm" onclick="App.lVoid('${s.id}')">Refund</button></tr>`).join('')}</table></div>`};
A.after.laporan=render;
const txt=()=>{const r=A._rep,T=A.db.settings;if(!r)return'';const n=r.n;return[`*Laporan ${T.name}*`,lbl(),`Dibuat: ${new Date().toLocaleString('id-ID')}`,...(T.kasir?['Kasir: '+T.kasir]:[]),...(T.lokasi?['Lokasi: '+T.lokasi]:[]),'',`Uang diterima: ${A.rp(r.uang)}`,...Object.entries(r.by).map(([k,v])=>`  - ${k}: ${A.rp(v)}`),`Transaksi: ${r.ok.length}`,`Total terjual: ${r.tot.jual}`,'','*Stok (diterima | masuk | terjual | keluar | sisa)*',...r.rows.map(x=>`${x.name}: ${n(x.terima)} | ${x.masuk} | ${x.jual} | ${x.keluar} | ${n(x.sisa)}`),`*TOTAL: ${r.tot.terima} | ${r.tot.masuk} | ${r.tot.jual} | ${r.tot.keluar} | ${r.tot.sisa}*`].join('\n')};
A.wa=()=>{const el=A.$('wano');let n=(el.value||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);A.db.settings.waNo=el.value.trim();A.save();
const u='https://wa.me/'+n+'?text='+encodeURIComponent(txt());if(!window.open(u,'_blank'))location.href=u};
A.waShare=()=>navigator.share?navigator.share({text:txt()}).catch(()=>{}):A.toast('Bagikan tidak didukung di sini — pakai Salin teks');
A.waCopy=()=>{const t=txt(),ok=()=>A.toast('Teks laporan disalin');if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(ok,()=>A.toast('Gagal menyalin'));
const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')?ok():A.toast('Gagal menyalin')}catch(e){A.toast('Gagal menyalin')}x.remove()};
A.lD=v=>{if(v){day=v;render()}};
A.lPrint=id=>A.receipt(A.db.sales.find(s=>s.id===id));
A.lVoid=id=>{const s=A.db.sales.find(s=>s.id===id);if(!s||s.status!=='done'||!confirm('Refund '+s.no+'? Stok kembali dihitung.'))return;s.status='refund';A.save();render()};
const csv=(n,r)=>A.download(n,r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
A.lCsv=()=>{const r=calc();csv('stok-'+day+'.csv',[['produk','diterima','masuk','terjual','keluar','sisa'],...r.rows.map(x=>[x.name,r.n(x.terima),x.masuk,x.jual,x.keluar,r.n(x.sisa)]),['TOTAL',r.tot.terima,r.tot.masuk,r.tot.jual,r.tot.keluar,r.tot.sisa]])};
A.lCsvJ=()=>csv('penjualan-'+day+'.csv',[['no','waktu','metode','diterima'],...A.db.sales.filter(s=>s.status==='done'&&A.dk(s.at)===day).map(s=>[s.no,new Date(s.at).toISOString(),s.method,s.total])]);
})(App);

</script>
<script>
(function(A){
const tabs={laporan:'Laporan',pos:'Kasir',terima:'Terima',produk:'Produk',set:'Pengaturan'};
A.views.set=()=>{const s=A.db.settings;return`<h2>Pengaturan</h2><form class="card grid" onsubmit="App.sSave(event)">
<label>Nama toko<input name=name value="${A.esc(s.name)}" required></label>
<label>Nama kasir<input name=kasir value="${A.esc(s.kasir)}"></label>
<label>Lokasi merchant<input name=lokasi value="${A.esc(s.lokasi)}" placeholder="mis. Jl. Mawar No. 5, Kota"></label>
<label>No. kontak / WA<input name=kontak type=tel value="${A.esc(s.kontak)}"></label>
<label>Instagram<input name=ig value="${A.esc(s.ig)}" placeholder="username"></label>
<label>TikTok<input name=tiktok value="${A.esc(s.tiktok)}" placeholder="username"></label>
<label>Pajak (%)<input name=tax type=number min=0 max=100 step=0.1 value="${s.tax||0}"></label>
<button class=btn>Simpan</button></form>
<div class=card><h3>Backup &amp; Restore</h3><p class=mu>Data tersimpan di browser (localStorage). Jika data situs dihapus, data hilang — rutin unduh backup.</p>
<button class=btn onclick="App.sBackup()">Unduh backup JSON</button> <label class=btn2 style="display:inline-block;cursor:pointer;padding:.6rem 1rem">Restore<input type=file accept=".json" hidden onchange="App.sRestore(this.files[0])"></label>
<button class=btn2 onclick="App.sDemo()">Isi contoh (2 ukuran cup)</button> <button class=btn2 onclick="App.sReset()">Hapus semua data</button></div>`};
A.sSave=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(A.db.settings,{kasir:f.get('kasir').trim(),lokasi:f.get('lokasi').trim(),kontak:f.get('kontak').trim(),ig:f.get('ig').trim().replace(/^@/,''),tiktok:f.get('tiktok').trim().replace(/^@/,'')});A.db.settings.name=f.get('name');A.db.settings.tax=Math.max(0,+f.get('tax')||0);A.save();A.toast('Tersimpan');A.go('set')};
A.sBackup=()=>A.download('omnipos-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:2,...A.db}),'application/json');
A.sRestore=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.settings)throw 0;if(!confirm(`Timpa data saat ini dengan backup (${d.products.length} produk, ${d.sales.length} transaksi)?`))return;A.db=d;delete d.v;A.migrate();A.save();A.go('set');A.toast('Restore berhasil')}catch(e){A.toast('File backup tidak valid')}};r.readAsText(f)};
A.sDemo=()=>{if(A.db.products.length&&!confirm('Tambahkan contoh produk?'))return;[['Minuman - Cup Kecil',12000],['Minuman - Cup Besar',15000]].forEach(([name,price])=>{if(!A.db.products.some(p=>p.name===name&&!p.archived))A.db.products.push({id:A.id(),name,price,archived:false})});A.save();A.toast('Contoh ditambahkan');A.go('produk')};
A.sReset=()=>{if(confirm('Hapus SEMUA data? Tidak bisa dibatalkan.')&&confirm('Yakin? Unduh backup dulu bila perlu.')){localStorage.removeItem('omnipos_v1');location.reload()}};
const TH=['system','light','dark'],THL={system:'Sistem',light:'Terang',dark:'Gelap'};
A.applyTheme=()=>{const t=A.db.settings.theme||'system';if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;A.$('th').textContent='Tema: '+THL[t]};
A.theme=()=>{const t=A.db.settings.theme||'system';A.db.settings.theme=TH[(TH.indexOf(t)+1)%3];A.save();A.applyTheme()};
A.menu=o=>{A.$('drawer').classList.toggle('open',o);A.$('ov').classList.toggle('open',o);A.$('drawer').setAttribute('aria-hidden',!o);A.$('mb').setAttribute('aria-expanded',o);if(o){const b=A.$('nav').querySelector('.on')||A.$('nav').firstChild;b&&b.focus()}else if(A._mo)A.$('mb').focus();A._mo=o};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){A.menu(false);A.pyClose&&A.pyClose();A.rcClose&&A.rcClose()}});
A.go=n=>{A._mo=false;A.menu(false);A.applyTheme();A.$('brand').textContent=A.db.settings.name;A.$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===n?'on':''}" onclick="App.go('${k}')">${v}</button>`).join('');A.$('main').innerHTML=(A.canStore?'':'<div class=card><b>Penyimpanan browser tidak tersedia</b> — data tidak akan tersimpan setelah halaman ditutup. Buka lewat Chrome dari alamat file:// atau hosting, bukan dari content://.</div>')+A.views[n]();A.after[n]&&A.after[n]()};
A.go('pos');
})(App);

</script>
</body></html>

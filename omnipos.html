<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniPOS</title><style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mu:#7a746b;--card:#fff;--ln:#e6e1d8;--ac:#b4411f;--on:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,#brand{font-family:Georgia,serif;font-weight:700}h2{font-size:2rem;margin:.2em 0 .6em}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
#brand{font-size:1.4rem;color:var(--ac)}
#burger{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer;font-size:1.3rem}
#th{margin-left:auto;min-height:36px;padding:.3rem .8rem}
nav{position:fixed;top:58px;left:0;bottom:0;width:220px;display:flex;flex-direction:column;gap:.35rem;padding:.8rem .7rem;border-right:1px solid var(--ln);background:var(--bg);transform:translateX(-110%);transition:transform .2s ease;z-index:6}
body.nav-open nav{transform:translateX(0)}
nav button{background:none;border:0;color:var(--mu);padding:.7rem .9rem;cursor:pointer;font:inherit;text-align:left;border-left:2px solid transparent;border-radius:4px}
nav button.on{color:var(--fg);border-color:var(--ac);background:rgba(180,65,31,.08)}
main{max-width:1200px;margin:auto;padding:1rem 1.2rem 4rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
input,select{padding:.6rem;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac)}
.search{width:100%;margin-bottom:.8rem}
.btn,.btn2{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer;font:inherit;min-height:42px}
.btn2{background:none;color:var(--ac)}.sm{padding:.2rem .5rem;min-height:0;font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:.8rem;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1rem}
.kpi div{border-left:3px solid var(--ac);padding-left:.8rem}.kpi small{color:var(--mu);display:block}.kpi b{font:700 1.7rem Georgia,serif}
.pos{display:grid;grid-template-columns:1fr 360px;gap:1rem}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.pg button{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:.7rem;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-height:70px}
.pg button:disabled{opacity:.4}.pg small{color:var(--mu);display:block}
.tot{font:700 2.2rem Georgia,serif;color:var(--ac)}.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.3rem 0}
.low{color:var(--ac);font-weight:600}.mu{color:var(--mu)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:4px;display:none;z-index:9}
form label{display:grid;gap:.25rem;color:var(--mu);font-size:.8rem}
.sum td{border-top:2px solid var(--fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chips .on{background:var(--ac);color:var(--on)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal-box{background:var(--card);border:1px solid var(--ln);border-radius:8px;max-width:420px;width:min(90vw,420px);padding:1rem}
.receipt-body{margin:0;background:#d8d1c5;font-family:Courier New,Segoe UI,Arial,sans-serif;color:#111}
.receipt-wrap{width:300px;margin:0 auto;background:#f3efe8;padding:12px 14px 18px;box-shadow:none;border:0}
.receipt-brand{font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;margin:0}
.receipt-address{font-size:12px;font-weight:700;line-height:1.3;letter-spacing:.04em;text-align:center;margin:4px 0 8px;white-space:normal}
.receipt-meta{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.04em;margin:8px 0 6px}
.receipt-meta .left{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.receipt-meta .right{text-align:right;white-space:nowrap}
.receipt-dash{height:2px;border-top:2px dashed rgba(17,17,17,.95);margin:8px 0 10px}
.receipt-item{display:grid;grid-template-columns:minmax(0,1fr) 22px 58px 60px;align-items:start;gap:8px;font-size:13px;line-height:1.4;margin:2px 0;font-weight:700}
.receipt-item-name{overflow-wrap:anywhere;letter-spacing:.02em;text-transform:uppercase}
.receipt-item-qty,.receipt-item-price,.receipt-item-total{text-align:right;white-space:nowrap}
.receipt-summary{margin-top:8px}
.receipt-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:14px;margin:2px 0;font-weight:700}
.receipt-row .label{text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.receipt-row .value{text-align:right;white-space:nowrap}
.receipt-row.total{font-size:18px;margin-top:10px;padding-top:8px;border-top:2px dashed rgba(17,17,17,.95)}
.receipt-footer{text-align:center;font-size:11px;line-height:1.5;padding-top:8px;margin-top:10px;border-top:2px dashed rgba(17,17,17,.95);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
@media print{body{background:#fff}.receipt-wrap{padding:0;margin:0;width:300px;box-shadow:none;border:0}}
</style></head>
<body>
<header><button id="burger" aria-label="Buka menu" onclick="App.toggleNav()">☰</button><b id="brand">OmniPOS</b><button id="th" class="btn2" onclick="App.theme()" aria-label="Ganti tema"></button></header>
<nav id="nav"></nav>
<main id="main"></main><div id="toast"></div>
<script>
window.App={views:{},after:{}};
App.canStore=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
(function(A){
const K='omnipos_v1';
let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
A.db=d||{products:[],sales:[],days:{},settings:{name:'Toko Saya',tax:0,seq:0}};
A.save=()=>{try{localStorage.setItem(K,JSON.stringify(A.db))}catch(e){A.toast('Gagal menyimpan: '+e.message)}};
A.id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
A.rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
A.fmt=n=>Number(Math.round(n)).toLocaleString('id-ID');
A.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
A.$=id=>document.getElementById(id);
A.toast=m=>{const t=A.$('toast');t.textContent=m;t.style.display='block';clearTimeout(A._t);A._t=setTimeout(()=>t.style.display='none',2500)};
A.prod=id=>A.db.products.find(p=>p.id===id);
A.download=(name,text,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;a.click()};
A.migrate=()=>{const D=A.db;D.days=D.days||{};D.products=D.products||[];D.sales=D.sales||[];D.settings=D.settings||{name:'Toko Saya',tax:0,seq:0};delete D.moves;D.products.forEach(p=>{delete p.opening;delete p.incoming;delete p.outgoing;delete p.archived})};
A.migrate();
A.dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
A.recv=(day,pid)=>{const r=(A.db.days[day]||{}).recv;return r&&pid in r?r[pid]:null};
A.stockIn=(day,pid)=>{const d=A.db.days[day]||{};const v=(d.in||d.recv)||{};return pid in v?v[pid]:null};
A.stockOut=(day,pid)=>{const r=(A.db.days[day]||{}).out;return r&&pid in r?r[pid]:0};
A.opening=(day,pid)=>{const ks=Object.keys(A.db.days).filter(k=>k<day).sort();let x=0;for(const k of ks){const d=A.db.days[k]||{};const inq=(d.in&&pid in d.in?d.in[pid]:(d.recv&&pid in d.recv?d.recv[pid]:0));const outq=(d.out&&pid in d.out?d.out[pid]:0);x+=inq-outq}return x};
A.sold=(day,pid)=>A.db.sales.reduce((a,s)=>s.status==='done'&&A.dk(s.at)===day?a+s.items.filter(i=>i.pid===pid).reduce((x,i)=>x+i.qty,0):a,0);
A.sisa=(day,pid)=>{const awal=A.opening(day,pid),inQ=A.stockIn(day,pid)||0,outQ=A.stockOut(day,pid)||0;return awal+inQ-outQ-A.sold(day,pid)};
A.toggleNav=()=>{document.body.classList.toggle('nav-open')};
A.closeNav=()=>{document.body.classList.remove('nav-open')};
})(App);
</script>
<script>
(function(A){
let edit=null;
A.views.produk=()=>{const p=edit?A.prod(edit):{};
return `<h2>Produk</h2><form class="card grid" onsubmit="App.pSave(event)"><label>Nama produk<input name=name required value="${A.esc(p.name)}"></label><label>Harga jual<input name=price type=number min=0 step=100 value="${(p.price??'')}" required></label><button class="btn" type="submit">${edit?'Simpan':'Tambah'}</button><button class="btn2" type="button" onclick="App.go('produk')">Batal</button></form><div id=plist class="card"></div>`};
A.after.produk=()=>{const r=A.db.products.filter(p=>!p.archived);A.$('plist').innerHTML=r.length?`<table><tr><th>Produk</th><th>Harga</th><th></th></tr>${r.map(p=>`<tr><td>${A.esc(p.name)}</td><td>${A.rp(p.price)}</td><td><button class="btn2 sm" type="button" onclick="App.pEdit('${p.id}')">Edit</button> <button class="btn2 sm" type="button" onclick="App.pArch('${p.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<p class="mu">Belum ada produk.</p>'};
A.pEdit=id=>{edit=id;A.go('produk')};
A.pSave=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),price=Math.floor(+f.get('price'));if(!name||!(price>=0))return A.toast('Data tidak valid');if(edit)Object.assign(A.prod(edit),{name,price});else A.db.products.push({id:A.id(),name,price});edit=null;A.save();A.go('produk')};
A.pArch=id=>{if(confirm('Hapus produk dari daftar? Riwayat penjualan tetap aman.')){A.prod(id).archived=true;A.save();A.go('produk')}};
})(App);
</script>
<script>
(function(A){
A.views.terima=()=>{const day=A.dk(Date.now()),ps=A.db.products.filter(p=>!p.archived),rows=ps.map(p=>{const v=A.stockIn(day,p.id),awal=A.opening(day,p.id),out=A.stockOut(day,p.id),jual=A.sold(day,p.id);return`<tr><td>${A.esc(p.name)}</td><td>${A.fmt(awal)}</td><td>${A.fmt(v??0)}</td><td>${A.fmt(out)}</td><td>${A.fmt(jual)}</td><td>${A.fmt(awal+(v??0)-out-jual)}</td></tr>`}).join('');
return `<h2>Stok</h2><div class="card"><p class=mu>Catat penerimaan (in) dan transfer antar outlet (out) per produk untuk memengaruhi stok harian.</p><button type="button" class="btn" onclick="App.tOpen()">Tambah stok</button></div><div class="card tw"><table><tr><th>Produk</th><th>Awal</th><th>In</th><th>Out</th><th>Jual</th><th>Sisa</th></tr>${rows}</table></div>`};
A.tOpen=()=>{const modal=A.$('tmodal');if(modal){modal.style.display='flex';const p=A.$('tform').querySelector('[name=pid]');if(p)p.focus();}};
A.tClose=()=>{const modal=A.$('tmodal');if(modal)modal.style.display='none';};
A.tStockSave=e=>{e.preventDefault();const day=A.dk(Date.now()),f=new FormData(e.target),kind=f.get('kind'),pid=f.get('pid'),qty=Math.floor(+f.get('qty'));if(!pid||!(qty>0))return A.toast('Jumlah tidak valid');const d=A.db.days[day]||(A.db.days[day]={});d[kind]||(d[kind]={});d[kind][pid]=(d[kind][pid]||0)+qty;A.save();A.tClose();A.go('terima')};
A.tSave=e=>{e.preventDefault();const f=new FormData(e.target),day=A.dk(Date.now()),r={};for(const p of A.db.products.filter(p=>!p.archived)){const v=f.get('r_'+p.id);if(v===''||v===null)continue;const n=Math.floor(+v);if(n<0)continue;r[p.id]=n}if(Object.keys(r).length){A.db.days[day]||(A.db.days[day]={});A.db.days[day].recv=r;A.save();A.toast('Data stok disimpan')}A.go('terima')};
})(App);
</script>
<script>
(function(A){
A.cart=[];A.key=A.id();let q='',disc=0,pay='pas';
const day=()=>A.dk(Date.now());
const sum=()=>{const sub=A.cart.reduce((a,c)=>a+A.prod(c.pid).price*c.qty,0),d=Math.min(disc,sub),tax=Math.round((sub-d)*(A.db.settings.tax||0)/100);return{sub,d,tax,total:sub-d+tax}};
A.views.pos=()=>`<div class=pos><div><h2>Kasir</h2><input class=search placeholder="Cari produk..." oninput="App.xQ(this.value)"><div id=pg class=pg></div></div><div class=card><h3>Keranjang</h3><div id=cl></div><div id=cb class=chips></div><div id=tt></div><div class="row"><span>Diskon</span><input type=number min=0 value="${disc}" oninput="App.xDisc(this.value)" style="width:110px"></div><div class="row"><span>Metode</span><select id=pm><option>Tunai</option><option>QRIS</option><option>Debit</option></select></div><div id=cw style="display:none" class="row"><span>Cash</span><input id=cash type=number min=0 step=100 value=0 style="width:110px"></div><button class="btn" onclick="App.checkout()">Bayar</button></div></div>`;
const grid=()=>{const r=A.db.products.filter(p=>!p.archived&&p.name.toLowerCase().includes(q.toLowerCase()));A.$('pg').innerHTML=r.map(p=>{const s=A.sisa(day(),p.id);return`<button ${!s||s<=0?'disabled':''} onclick="App.xAdd('${p.id}')"><b>${A.esc(p.name)}</b><small>Rp ${A.fmt(p.price)}<br>Stok ${s==null?'?':A.fmt(s)}</small></button>`}).join('')};
const cart=()=>{A.$('cl').innerHTML=A.cart.map((c,i)=>{const p=A.prod(c.pid);return`<div class=row><span>${A.esc(p.name)}<br><small class=mu>${A.rp(p.price)}</small></span><span><input type=number min=1 value="${c.qty}" style="width:60px" onchange="App.xQty(${i},this.value)"></span><button class="btn2 sm" type="button" onclick="App.xDel(${i})">Hapus</button></div>`}).join('')||'<p class=mu>Keranjang kosong</p>'};
const chips=()=>{A.$('cb').innerHTML=[['pas','Uang pas'],[20000,'20rb'],[50000,'50rb'],[100000,'100rb'],['manual','Lainnya']].map(([v,t])=>`<button type=button class="btn2 ${pay===v?'on':''}" onclick="App.xPay('${v}')">${t}</button>`).join('')};
const cashAmt=t=>pay==='pas'?t.total:pay==='manual'?(+A.$('cash').value||0):pay;
A.xPay=v=>{pay=(v==='pas'||v==='manual')?v:+v;const i=A.$('cash');i.style.display=pay==='manual'?'block':'none';chips();A.xTot();if(pay==='manual')i.focus()};
A.after.pos=()=>{grid();cart();chips();A.xTot()};
A.xQ=v=>{q=v;grid()};
A.xAdd=id=>{const c=A.cart.find(c=>c.pid===id),s=A.sisa(day(),id);if(s===null)return A.toast('Isi barang diterima dulu');if((c?c.qty:0)+1>s)return A.toast('Stok habis');c?c.qty++:A.cart.push({pid:id,qty:1});cart();A.xTot()};
A.xQty=(i,v)=>{const n=Math.floor(+v),s=A.sisa(day(),A.cart[i].pid);if(n>=1&&n<=s)A.cart[i].qty=n;else A.toast('Jumlah tidak valid');cart();A.xTot()};
A.xDel=i=>{A.cart.splice(i,1);cart();A.xTot()};A.xDisc=v=>{disc=Math.max(0,Math.floor(+v)||0);A.xTot()};
A.xTot=()=>{const t=sum(),tunai=A.$('pm').value==='Tunai',c=cashAmt(t);A.$('cw').style.display=tunai?'':'none';A.$('tt').innerHTML=`<div class=row><span>Subtotal</span><span>${A.rp(t.sub)}</span></div><div class=row><span>Diskon</span><span>-${A.rp(t.d)}</span></div><div class=row><span>PPN</span><span>${A.rp(t.tax)}</span></div><div class=row><span>Total</span><span class=tot>${A.rp(t.total)}</span></div><div class=row><span>Cash</span><span>${A.rp(c)}</span></div>`;};
A.checkout=()=>{if(!A.cart.length)return A.toast('Keranjang kosong');if(A.db.sales.some(s=>s.key===A.key))return A.toast('Transaksi ini sudah tersimpan');const t=sum(),m=A.$('pm').value,cash=cashAmt(t),total=t.total;const sale={id:A.id(),key:A.key,no:'TRX-'+(A.db.settings.seq||0 + 1),at:new Date().toISOString(),method:m,status:'done',items:A.cart.map(x=>({pid:x.pid,qty:x.qty,price:A.prod(x.pid).price})),subtotal:t.sub,discount:t.d,tax:t.tax,total:total,received:cash,change:cash-total};A.db.settings.seq=(A.db.settings.seq||0)+1;sale.no='TRX-'+String(A.db.settings.seq).padStart(4,'0');A.db.sales.push(sale);A.save();A.receipt(sale);A.cart=[];A.key=A.id();disc=0;pay='pas';A.go('pos');};
const soc=()=>{const t=A.db.settings;return[t.ig&&'IG: @'+t.ig,t.tiktok&&'TikTok: @'+t.tiktok].filter(Boolean).map(x=>'\n'+A.esc(x)).join('')};
A.receipt=s=>{const T=A.db.settings;const w=window.open('','_blank','width=360,height=660');if(!w)return A.toast('Popup diblokir — lihat struk di menu Laporan');const saleItems=s.items||[];const total= saleItems.reduce((a,i)=>a+i.qty*i.price,0);const subtotal = saleItems.reduce((a,i)=>a+i.qty*i.price,0);const shopName=A.esc(T.name||'OMNIPOS');const address=A.esc((T.lokasi||'JALAN RAYA') + (T.kontak ? ' / ' + T.kontak : ''));const when=new Date(s.at);const dateText=when.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g,'/');const timeText=when.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});const body=`<div class="receipt-wrap"><div class="receipt-brand">${shopName}</div><div class="receipt-address">${address}</div><div class="receipt-dash"></div><div class="receipt-meta"><div class="left">${A.esc(dateText)} ${A.esc(timeText)}</div><div class="right">#${A.esc(s.no||s.id)}</div></div><div class="receipt-dash"></div>${saleItems.map(i=>{const p=A.prod(i.pid);const lineTotal=i.qty*i.price;return `<div class="receipt-item"><div class="receipt-item-name">${A.esc(p&&p.name?p.name:'ITEM')}</div><div class="receipt-item-qty">${A.esc(String(i.qty))}</div><div class="receipt-item-price">${A.fmt(i.price)}</div><div class="receipt-item-total">${A.fmt(lineTotal)}</div></div>`}).join('')}<div class="receipt-dash"></div><div class="receipt-summary"><div class="receipt-row"><div class="label">Harga jual</div><div class="value">${A.fmt(subtotal)}</div></div><div class="receipt-row"><div class="label">Total</div><div class="value">${A.fmt(s.total)}</div></div></div><div class="receipt-footer">Terima kasih<br>Selamat berbelanja</div></div>`;w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Struk</title><style>body{margin:0;background:#d8d1c5;padding:0;font-family:Courier New,Segoe UI,Arial,sans-serif;color:#111}.receipt-body{margin:0;background:#d8d1c5}.receipt-wrap{width:300px;padding:12px 14px 18px;margin:0 auto;background:#f3efe8;box-sizing:border-box;letter-spacing:0}.receipt-brand{font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;margin:0}.receipt-address{font-size:12px;font-weight:700;line-height:1.3;letter-spacing:.04em;text-align:center;margin:4px 0 8px}.receipt-meta{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.04em;margin:8px 0 6px}.receipt-meta .left{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.receipt-meta .right{text-align:right;white-space:nowrap}.receipt-dash{height:2px;border-top:2px dashed rgba(17,17,17,.95);margin:8px 0 10px}.receipt-item{display:grid;grid-template-columns:minmax(0,1fr) 22px 58px 60px;align-items:start;gap:8px;font-size:13px;line-height:1.4;margin:2px 0;font-weight:700}.receipt-item-name{overflow-wrap:anywhere;letter-spacing:.02em;text-transform:uppercase}.receipt-item-qty,.receipt-item-price,.receipt-item-total{text-align:right;white-space:nowrap}.receipt-summary{margin-top:8px}.receipt-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:14px;margin:2px 0;font-weight:700}.receipt-row .label{text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.receipt-row .value{text-align:right;white-space:nowrap}.receipt-row.total{font-size:18px;margin-top:10px;padding-top:8px;border-top:2px dashed rgba(17,17,17,.95)}.receipt-footer{text-align:center;font-size:11px;line-height:1.5;padding-top:8px;margin-top:10px;border-top:2px dashed rgba(17,17,17,.95);font-weight:700;letter-spacing:.05em;text-transform:uppercase}</style></head><body class="receipt-body">${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),200)};
})(App);
</script>
<script>
(function(A){
let day=A.dk(Date.now());
const lbl=()=>new Date(day+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
A.views.laporan=()=>`<h2>Laporan Harian</h2><input type=date value="${day}" max="${A.dk(Date.now())}" onchange="App.lD(this.value)"> <button class=btn2 onclick="App.lCsv()">CSV stok</button> <button class=btn2 onclick="App.lCsvJ()">CSV penjualan</button><div id=rep class="card"></div>`;
const calc=()=>{const ok=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day),by={};ok.forEach(x=>by[x.method]=(by[x.method]||0)+x.total);const rows=A.db.products.filter(p=>!p.archived||A.stockIn(day,p.id)!=null).map(p=>{const awal=A.opening(day,p.id),inQ=A.stockIn(day,p.id)||0,outQ=A.stockOut(day,p.id)||0,jual=A.sold(day,p.id),sisa=awal+inQ-outQ-jual;return{...p,awal,inQ,outQ,jual,sisa}});const tot=rows.reduce((a,x)=>({awal:a.awal+x.awal,in:a.in+x.inQ,out:a.out+x.outQ,jual:a.jual+x.jual,sisa:a.sisa+x.sisa}),{awal:0,in:0,out:0,jual:0,sisa:0});return{ok,rows,tot,uang:ok.reduce((a,x)=>a+x.total,0),n:A.fmt};};
const render=()=>{const r=calc();A._rep=r;const all=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day).sort((a,b)=>b.at-a.at);A.$('rep').innerHTML=`<p class=mu>${lbl()}</p><div class=kpi><div><small>Transaksi</small><b>${r.ok.length}</b></div><div><small>Uang masuk</small><b>${A.rp(r.uang)}</b></div><div><small>Stok sisa</small><b>${r.rows.reduce((a,x)=>a+x.sisa,0)}</b></div></div><div class="tw"><table><tr><th>Produk</th><th>Awal</th><th>In</th><th>Out</th><th>Jual</th><th>Sisa</th></tr>${r.rows.map(x=>`<tr><td>${A.esc(x.name)}</td><td>${A.fmt(x.awal)}</td><td>${A.fmt(x.inQ)}</td><td>${A.fmt(x.outQ)}</td><td>${A.fmt(x.jual)}</td><td>${A.fmt(x.sisa)}</td></tr>`).join('')}</table></div>`;};
A.after.laporan=render;
A.wa=()=>{const el=A.$('wano');let n=(el.value||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);A.db.settings.waNo=el.value.trim();A.save();const u='https://wa.me/'+n+'?text='+encodeURIComponent('Laporan '+A.db.settings.name+'\n'+A._rep.rows.map(x=>`${x.name}: ${A.fmt(x.sisa)}`).join('\n'));window.open(u,'_blank');};
A.waShare=()=>navigator.share?navigator.share({text:'Laporan '+A.db.settings.name+'\n'+A._rep.rows.map(x=>`${x.name}: ${A.fmt(x.sisa)}`).join('\n')}).catch(()=>{}):A.toast('Bagikan tidak didukung di sini — pakai Salin teks');
A.waCopy=()=>{const t='Laporan '+A.db.settings.name+'\n'+A._rep.rows.map(x=>`${x.name}: ${A.fmt(x.sisa)}`).join('\n');if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>A.toast('Teks laporan disalin'),()=>A.toast('Gagal menyalin'));const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');document.body.removeChild(x);A.toast('Teks laporan disalin')};
A.lD=v=>{if(v){day=v;render()}};
A.lPrint=id=>A.receipt(A.db.sales.find(s=>s.id===id));
A.lVoid=id=>{const s=A.db.sales.find(s=>s.id===id);if(!s||s.status!=='done'||!confirm('Refund '+s.no+'? Stok kembali dihitung.'))return;s.status='refund';A.save();render()};
const csv=(n,r)=>A.download(n,r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
A.lCsv=()=>{const r=calc();csv('stok-'+day+'.csv',[['produk','stok_awal','stok_in','stok_out','terjual','sisa'],...r.rows.map(x=>[x.name,x.awal,x.inQ,x.outQ,x.jual,x.sisa]),['TOTAL',r.tot.awal,r.tot.in,r.tot.out,r.tot.jual,r.tot.sisa]]);};
A.lCsvJ=()=>csv('penjualan-'+day+'.csv',[['no','waktu','metode','diterima'],...A.db.sales.filter(s=>s.status==='done'&&A.dk(s.at)===day).map(s=>[s.no,new Date(s.at).toISOString(),s.method,s.total])]);
})(App);
</script>
<script>
(function(A){
const tabs={laporan:'Laporan',pos:'Kasir',terima:'Terima',produk:'Produk',set:'Pengaturan'};
A.views.set=()=>{const s=A.db.settings;return`<h2>Pengaturan</h2><form class="card grid" onsubmit="App.sSave(event)"><label>Nama toko<input name=name value="${A.esc(s.name)}" required></label><label>Kasir<input name=kasir value="${A.esc(s.kasir||'')}" ></label><label>Lokasi<input name=lokasi value="${A.esc(s.lokasi||'')}" ></label><label>Kontak<input name=kontak value="${A.esc(s.kontak||'')}" ></label><label>IG<input name=ig value="${A.esc(s.ig||'')}" ></label><label>Tiktok<input name=tiktok value="${A.esc(s.tiktok||'')}" ></label><label>PPN %<input name=tax type=number min=0 value="${(s.tax||0)}" ></label><button class="btn" type="submit">Simpan</button></form><div class="card"><button class="btn2" type="button" onclick="App.sBackup()">Backup</button> <input type=file accept="application/json" onchange="App.sRestore(this.files[0])" style="display:inline-block;width:180px"><button class="btn2" type="button" onclick="App.sDemo()">Demo</button> <button class="btn2" type="button" onclick="App.sReset()">Reset</button></div>`};
A.sSave=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(A.db.settings,{name:f.get('name').trim(),kasir:f.get('kasir').trim(),lokasi:f.get('lokasi').trim(),kontak:f.get('kontak').trim(),ig:f.get('ig').trim(),tiktok:f.get('tiktok').trim(),tax:Math.max(0,Math.floor(+f.get('tax')||0))});A.save();A.go('set')};
A.sBackup=()=>A.download('omnipos-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:2,...A.db}),'application/json');
A.sRestore=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.settings)throw 0;Object.assign(A.db,d);A.save();A.go('pos');A.toast('Backup dipulihkan')}catch(e){A.toast('File backup tidak valid')}};r.readAsText(f)};
A.sDemo=()=>{if(A.db.products.length&&!confirm('Tambahkan contoh produk?'))return;[['Minuman - Cup Kecil',12000],['Minuman - Cup Besar',15000]].forEach(([name,price])=>{if(!A.db.products.some(p=>p.name===name))A.db.products.push({id:A.id(),name,price})});A.save();A.go('produk')};
A.sReset=()=>{if(confirm('Hapus SEMUA data? Tidak bisa dibatalkan.')&&confirm('Yakin? Unduh backup dulu bila perlu.')){localStorage.removeItem('omnipos_v1');location.reload()}};
const TH=['system','light','dark'],THL={system:'Sistem',light:'Terang',dark:'Gelap'};
A.applyTheme=()=>{const t=A.db.settings.theme||'system';if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;A.$('th').textContent='Tema: '+(THL[t]||'Sistem')};
A.theme=()=>{const t=A.db.settings.theme||'system';A.db.settings.theme=TH[(TH.indexOf(t)+1)%3];A.save();A.applyTheme()};
A.go=n=>{A.applyTheme();A.$('brand').textContent=A.db.settings.name;A.$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===n?'on':''}" onclick="App.go('${k}')">${v}</button>`).join('');A.$('main').innerHTML=A.views[n]();A.after[n]&&A.after[n]();A.closeNav()};
A.go('pos');
})(App);
</script>
</body></html>

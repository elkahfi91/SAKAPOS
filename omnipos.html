<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniPOS</title><style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mu:#7a746b;--card:#fff;--ln:#e6e1d8;--ac:#b4411f;--on:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16140f;--fg:#f1ede4;--mu:#a39c8f;--card:#201d17;--ln:#332f27;--ac:#e8794f;--on:#16140f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,#brand{font-family:Georgia,serif;font-weight:700}h2{font-size:2rem;margin:.2em 0 .6em}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
#brand{font-size:1.4rem;color:var(--ac)}nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mu);padding:.4rem .7rem;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:1rem 1.2rem 4rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
input,select{padding:.6rem;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac)}
.search{width:100%;margin-bottom:.8rem}
.btn,.btn2{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer;font:inherit;min-height:42px}
.btn2{background:none;color:var(--ac)}.sm{padding:.2rem .5rem;min-height:0;font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:.8rem;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1rem}
.kpi div{border-left:3px solid var(--ac);padding-left:.8rem}.kpi small{color:var(--mu);display:block}.kpi b{font:700 1.7rem Georgia,serif}
.pos{display:grid;grid-template-columns:1fr 360px;gap:1rem}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.pg button{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:.7rem;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-height:70px}
.pg button:disabled{opacity:.4}.pg small{color:var(--mu);display:block}
.tot{font:700 2.2rem Georgia,serif;color:var(--ac)}.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.3rem 0}
.low{color:var(--ac);font-weight:600}.mu{color:var(--mu)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:4px;display:none;z-index:9}
#th{margin-left:auto;min-height:36px;padding:.3rem .8rem}
form label{display:grid;gap:.25rem;color:var(--mu);font-size:.8rem}
.sum td{border-top:2px solid var(--fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chips .on{background:var(--ac);color:var(--on)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal-box{background:var(--card);border:1px solid var(--ln);border-radius:8px;max-width:420px;width:min(90vw,420px);padding:1rem}
</style></head>
<body>
<header><b id="brand">OmniPOS</b><nav id="nav"></nav><button id="th" class="btn2" onclick="App.theme()" aria-label="Ganti tema"></button></header>
<main id="main"></main><div id="toast"></div>
<script>
window.App={views:{},after:{}};
App.canStore=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
(function(A){
const K='omnipos_v1';
let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
A.db=d||{products:[],sales:[],days:{},settings:{name:'Toko Saya',tax:0,seq:0}};
A.save=()=>{try{localStorage.setItem(K,JSON.stringify(A.db))}catch(e){A.toast('Gagal menyimpan: '+e.message)}};
A.id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
A.rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
A.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
A.$=id=>document.getElementById(id);
A.toast=m=>{const t=A.$('toast');t.textContent=m;t.style.display='block';clearTimeout(A._t);A._t=setTimeout(()=>t.style.display='none',2500)};
A.prod=id=>A.db.products.find(p=>p.id===id);
A.download=(name,text,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;a.click()};
A.migrate=()=>{const D=A.db;D.days=D.days||{};D.products=D.products||[];D.sales=D.sales||[];D.settings=D.settings||{name:'Toko Saya',tax:0,seq:0};delete D.moves;D.products.forEach(p=>{delete p.opening;delete p.hist;delete p.min;delete p.cost})};
A.migrate();
A.dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
A.recv=(day,pid)=>{const r=(A.db.days[day]||{}).recv;return r&&pid in r?r[pid]:null};
A.stockIn=(day,pid)=>{const d=A.db.days[day]||{};const v=(d.in||d.recv)||{};return pid in v?v[pid]:null};
A.stockOut=(day,pid)=>{const r=(A.db.days[day]||{}).out;return r&&pid in r?r[pid]:0};
A.opening=(day,pid)=>{const ks=Object.keys(A.db.days).filter(k=>k<day).sort();let x=0;for(const k of ks){const d=A.db.days[k]||{};const inq=(d.in&&pid in d.in?d.in[pid]:(d.recv&&pid in d.recv?d.recv[pid]:0))||0;const outq=(d.out&&pid in d.out?d.out[pid]:0)||0;x+=inq-outq-A.sold(k,pid)};return x};
A.sold=(day,pid)=>A.db.sales.reduce((a,s)=>s.status==='done'&&A.dk(s.at)===day?a+s.items.filter(i=>i.pid===pid).reduce((x,i)=>x+i.qty,0):a,0);
A.sisa=(day,pid)=>{const awal=A.opening(day,pid),inQ=A.stockIn(day,pid)||0,outQ=A.stockOut(day,pid)||0;return awal+inQ-outQ-A.sold(day,pid)};
})(App);
</script>
<script>
(function(A){
let edit=null;
A.views.produk=()=>{const p=edit?A.prod(edit):{};
return `<h2>Produk</h2><form class="card grid" onsubmit="App.pSave(event)"><label>Nama produk<input name=name required value="${A.esc(p.name)}"></label><label>Harga jual<input name=price type=number min=0 step=1 required value="${p.price??''}"></label><button class=btn>${edit?'Simpan':'Tambah'}</button>${edit?'<button type=button class=btn2 onclick="App.pEdit(null)">Batal</button>':''}</form><div id=plist class=tw></div>`};
A.after.produk=()=>{const r=A.db.products.filter(p=>!p.archived);A.$('plist').innerHTML=r.length?`<table><tr><th>Produk<th>Harga<th></tr>${r.map(p=>`<tr><td>${A.esc(p.name)}<td>${A.rp(p.price)}<td><button class="btn2 sm" onclick="App.pEdit('${p.id}')">Ubah</button> <button class="btn2 sm" onclick="App.pArch('${p.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<p class=mu>Belum ada produk.</p>'};
A.pEdit=id=>{edit=id;A.go('produk')};
A.pSave=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),price=Math.floor(+f.get('price'));if(!name||!(price>=0))return A.toast('Data tidak valid');if(edit)Object.assign(A.prod(edit),{name,price});else A.db.products.push({id:A.id(),name,price,archived:false});edit=null;A.save();A.toast('Tersimpan');A.go('produk')};
A.pArch=id=>{if(confirm('Hapus produk dari daftar? Riwayat penjualan tetap aman.')){A.prod(id).archived=true;A.save();A.go('produk')}};
})(App);
</script>
<script>
(function(A){
A.views.terima=()=>{const day=A.dk(Date.now()),ps=A.db.products.filter(p=>!p.archived),rows=ps.map(p=>{const v=A.stockIn(day,p.id),awal=A.opening(day,p.id),out=A.stockOut(day,p.id),jual=A.sold(day,p.id),sisa=A.sisa(day,p.id);return `<tr><td>${A.esc(p.name)}</td><td>${awal}</td><td>${v===null?'-':v}</td><td>${out||0}</td><td>${jual}</td><td><b>${sisa}</b></td></tr>`;}).join('');
return `<h2>Stok</h2><div class="card"><p class=mu>Catat penerimaan (in) dan transfer antar outlet (out) per produk untuk memengaruhi stok harian.</p><button type="button" class="btn" onclick="App.tOpen()">Tambah penerimaan / transfer</button></div><div id="tmodal" class="modal" style="display:none"><div class="modal-box"><div class="row"><h3 style="margin:0">Tambah stok</h3><button type="button" class="btn2" onclick="App.tClose()">Tutup</button></div><form id="tform" onsubmit="App.tStockSave(event)"><label>Jenis<select name="kind"><option value="in">Penerimaan (in)</option><option value="out">Transfer antar outlet (out)</option></select></label><label>Produk<select name="pid">${ps.map(p=>`<option value="${p.id}">${A.esc(p.name)}</option>`).join('')}</select></label><label>Jumlah<input name="qty" type="number" min="1" step="1" required></label><div class="row" style="margin-top:.8rem"><button type="button" class="btn2" onclick="App.tClose()">Batal</button><button class="btn">Simpan</button></div></form></div></div><form class="card" onsubmit="App.tSave(event)"><p class=mu>Isi sekali per hari: jumlah yang diterima kasir hari ini. Isian awal mengikuti hari sebelumnya, ubah bila berbeda.</p>${ps.map(p=>{const v=A.recv(day,p.id);return`<div class=row><span>${A.esc(p.name)}${v===null?'':' <small class=mu>(sudah diisi)</small>'}</span><input name="r_${p.id}" type=number min=0 step=1 value="${v===null?'':v}" placeholder="0"></div>`}).join('')}<button class="btn" style="margin-top:.8rem">Simpan penerimaan</button></form><div class="card"><h3>Ringkasan stok hari ini</h3><div class=tw><table><tr><th>Produk<th>Stok awal<th>Stok in<th>Stok out<th>Terjual<th>Sisa</tr>${rows||`<tr><td colspan="6">Belum ada catatan stok.</td></tr>`}</table></div></div>`};
A.tOpen=()=>{const modal=A.$('tmodal');if(modal){modal.style.display='flex';const p=A.$('tform').querySelector('[name=pid]');if(p)p.focus();}};
A.tClose=()=>{const modal=A.$('tmodal');if(modal)modal.style.display='none';};
A.tStockSave=e=>{e.preventDefault();const day=A.dk(Date.now()),f=new FormData(e.target),kind=f.get('kind'),pid=f.get('pid'),qty=Math.floor(+f.get('qty'));if(!pid||!(qty>0))return A.toast('Jumlah tidak valid');const d=A.db.days[day]=A.db.days[day]||{};d[kind]=d[kind]||{};if(kind==='out'){const before=A.opening(day,pid)+(A.stockIn(day,pid)||0)-A.stockOut(day,pid)-A.sold(day,pid);if(qty>before)return A.toast('Stok tidak cukup untuk transfer keluar');}d[kind][pid]=(d[kind][pid]||0)+qty;A.save();A.toast(kind==='in'?'Penerimaan ditambahkan':'Transfer stok disimpan');A.tClose();A.go('terima')};
A.tSave=e=>{e.preventDefault();const f=new FormData(e.target),day=A.dk(Date.now()),r={};for(const p of A.db.products.filter(p=>!p.archived)){const v=f.get('r_'+p.id);if(v===''||v===null)continue;const q=Math.floor(+v);if(!(q>=0))return A.toast('Jumlah tidak valid');if(q<A.sold(day,p.id))return A.toast(p.name+': kurang dari yang sudah terjual ('+A.sold(day,p.id)+')');r[p.id]=q}A.db.days[day]=A.db.days[day]||{};A.db.days[day].recv=Object.assign(A.db.days[day].recv||{},r);A.save();A.toast('Tersimpan');A.go('terima')};
})(App);
</script>
<script>
(function(A){
A.cart=[];A.key=A.id();let q='',disc=0,pay='pas';
const day=()=>A.dk(Date.now());
const sum=()=>{const sub=A.cart.reduce((a,c)=>a+A.prod(c.pid).price*c.qty,0),d=Math.min(disc,sub),tax=Math.round((sub-d)*(A.db.settings.tax||0)/100);return{sub,d,tax,total:sub-d+tax}};
A.views.pos=()=>`<div class=pos><div><h2>Kasir</h2><input class=search placeholder="Cari produk..." oninput="App.xQ(this.value)"><div id=pg class=pg></div></div><div class=card><h3>Keranjang</h3><div id=cl></div><div class=row><span>Diskon (Rp)</span><input type=number min=0 style="width:120px" value="${disc||''}" oninput="App.xDisc(this.value)"></div><div class=row><span>Metode</span><select id=pm onchange="App.xTot()"><option>Tunai<option>Transfer<option>Lainnya</select></div><div id=cw><div class=row><span>Uang diterima</span></div><div class=chips id=cb></div><input id=cash type=number min=0 placeholder="Masukkan nominal uang diterima" style="display:${pay==='manual'?'block':'none'};width:100%;margin-bottom:.5rem"></div><div id=tt></div><button class=btn style="width:100%;margin-top:.6rem" id=co onclick="App.checkout()">Bayar</button></div></div>`;
const grid=()=>{const r=A.db.products.filter(p=>!p.archived&&p.name.toLowerCase().includes(q.toLowerCase()));A.$('pg').innerHTML=r.map(p=>{const s=A.sisa(day(),p.id);return`<button ${!s||s<=0?'disabled':''} onclick="App.xAdd('${p.id}')"><b>${A.esc(p.name)}</b><small>${A.rp(p.price)} · ${s===null?'belum diisi':s+' tersisa'}</small></button>`}).join('')||'<p class=mu>Tidak ada produk.</p>'};
const cart=()=>{A.$('cl').innerHTML=A.cart.map((c,i)=>{const p=A.prod(c.pid);return`<div class=row><span>${A.esc(p.name)}<br><small class=mu>${A.rp(p.price)}</small></span><span><input type=number min=1 style="width:60px" value="${c.qty}" onchange="App.xQty(${i},this.value)"> <button type=button class="btn2 sm" onclick="App.xDel(${i})">Hapus</button></span></div>`}).join('')||'<p class=mu>Keranjang kosong.</p>'};
const chips=()=>{A.$('cb').innerHTML=[['pas','Uang pas'],[20000,'20rb'],[50000,'50rb'],[100000,'100rb'],['manual','Lainnya']].map(([v,t])=>`<button type=button class="btn2 ${pay===v?'on':''}" onclick="App.xPay(${JSON.stringify(v)})">${t}</button>`).join('')};
const cashAmt=t=>pay==='pas'?t.total:pay==='manual'?(+A.$('cash').value||0):pay;
A.xPay=v=>{pay=(v==='pas'||v==='manual')?v:+v;const i=A.$('cash');i.style.display=pay==='manual'?'block':'none';chips();A.xTot();if(pay==='manual')i.focus()};
A.after.pos=()=>{grid();cart();chips()};
A.xQ=v=>{q=v;grid()};
A.xAdd=id=>{const c=A.cart.find(c=>c.pid===id),s=A.sisa(day(),id);if(s===null)return A.toast('Isi barang diterima dulu');if((c?c.qty:0)+1>s)return A.toast('Stok habis');c?c.qty++:A.cart.push({pid:id,qty:1});cart();A.xTot()};
A.xQty=(i,v)=>{const n=Math.floor(+v),s=A.sisa(day(),A.cart[i].pid);if(n>=1&&n<=s)A.cart[i].qty=n;else A.toast('Jumlah tidak valid');cart();A.xTot()};
A.xDel=i=>{A.cart.splice(i,1);cart();A.xTot()};A.xDisc=v=>{disc=Math.max(0,Math.floor(+v)||0);A.xTot()};
A.xTot=()=>{const t=sum(),tunai=A.$('pm').value==='Tunai',c=cashAmt(t);A.$('cw').style.display=tunai?'':'none';A.$('tt').innerHTML=`<div class=row><span>Subtotal</span><span>${A.rp(t.sub)}</span></div><div class=row><span>Diskon</span><span>-${A.rp(t.d)}</span></div><div class=row><span>Pajak</span><span>${A.rp(t.tax)}</span></div><div class=row><span>Total</span><span class=tot>${A.rp(t.total)}</span></div>${tunai?`<div class=row><span>Uang diterima</span><span>${A.rp(c)}</span></div><div class=row><span>Kembali</span><span>${A.rp(Math.max(0,c-t.total))}</span></div>`:''}`;};
A.checkout=()=>{if(!A.cart.length)return A.toast('Keranjang kosong');if(A.db.sales.some(s=>s.key===A.key))return A.toast('Transaksi ini sudah tersimpan');const t=sum(),m=A.$('pm').value,cash=cashAmt(t);for(const c of A.cart){const p=A.prod(c.pid),s=p&&A.sisa(day(),c.pid);if(!p||p.archived||s===null||s<c.qty)return A.toast('Stok tidak cukup: '+(p?p.name:'?'))}if(m==='Tunai'&&cash<t.total)return A.toast('Uang kurang');A.$('co').disabled=true;const st=A.db.settings;st.seq=(st.seq||0)+1;const s={id:A.id(),kasir:st.kasir||'',key:A.key,no:'INV-'+day().replace(/-/g,'')+'-'+String(st.seq).padStart(4,'0'),at:Date.now(),status:'done',method:m,items:A.cart.map(c=>{const p=A.prod(c.pid);return{pid:p.id,name:p.name,price:p.price,qty:c.qty}}),sub:t.sub,disc:t.d,tax:t.tax,total:t.total,cash:m==='Tunai'?cash:t.total,change:m==='Tunai'?cash-t.total:0};A.db.sales.push(s);A.cart=[];A.key=A.id();disc=0;pay='pas';A.save();A.receipt(s);A.go('pos')};
const soc=()=>{const t=A.db.settings;return[t.ig&&'IG: @'+t.ig,t.tiktok&&'TikTok: @'+t.tiktok].filter(Boolean).map(x=>'\n'+A.esc(x)).join('')};
A.receipt=s=>{const T=A.db.settings,w=window.open('','_blank','width=380,height=600');if(!w)return A.toast('Popup diblokir — lihat struk di menu Laporan');const lines=[A.esc(T.name),T.lokasi?A.esc(T.lokasi):'',T.kontak?'Telp: '+A.esc(T.kontak):'',s.no,s.kasir?'Kasir: '+A.esc(s.kasir):'',new Date(s.at).toLocaleString('id-ID'),...s.items.map(i=>`${A.esc(i.name)} ${i.qty}x${A.rp(i.price)}`),`Subtotal: ${A.rp(s.sub)}`,'Diskon: -'+A.rp(s.disc||0),`Pajak: ${A.rp(s.tax)}`,`Total: ${A.rp(s.total)}`,`Bayar: ${A.rp(s.cash)}`,`Kembali: ${A.rp(s.change)}`,soc()].filter(Boolean).join('\n');w.document.write(`<pre style="font:13px monospace;width:300px">${lines}</pre>`);w.document.close()};
})(App);
</script>
<script>
(function(A){
let day=A.dk(Date.now());
const lbl=()=>new Date(day+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
A.views.laporan=()=>`<h2>Laporan Harian</h2><input type=date value="${day}" max="${A.dk(Date.now())}" onchange="App.lD(this.value)"> <button class=btn2 onclick="App.lCsv()">CSV stok</button> <button class=btn2 onclick="App.lCsvJ()">CSV penjualan</button><div class=card style="margin-top:1rem"><b>Kirim laporan via WhatsApp</b><div class=grid style="margin-top:.5rem"><input id=wano type=tel placeholder="No. WA tujuan (opsional), mis. 0812..." value="${A.db.settings.waNo||''}"><button class=btn onclick="App.wa()">Kirim</button><button class=btn2 onclick="App.waShare()">Bagikan</button><button class=btn2 onclick="App.waCopy()">Salin teks</button></div></div><div id=rep></div>`;
const calc=()=>{const ok=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day),by={};ok.forEach(x=>by[x.method]=(by[x.method]||0)+x.total);const rows=A.db.products.filter(p=>!p.archived||A.stockIn(day,p.id)!==null||A.stockOut(day,p.id)>0||A.sold(day,p.id)>0||A.opening(day,p.id)!==0).map(p=>({name:p.name,awal:A.opening(day,p.id),in:A.stockIn(day,p.id)||0,out:A.stockOut(day,p.id)||0,jual:A.sold(day,p.id),sisa:A.sisa(day,p.id)}));const n=v=>v===null?'-':v;const tot={awal:rows.reduce((a,r)=>a+r.awal,0),in:rows.reduce((a,r)=>a+r.in,0),out:rows.reduce((a,r)=>a+r.out,0),jual:rows.reduce((a,r)=>a+r.jual,0),sisa:rows.reduce((a,r)=>a+r.sisa,0)};return{ok,by,rows,tot,n,uang:ok.reduce((a,x)=>a+x.total,0)}};
const render=()=>{const r=calc(),n=r.n;A._rep=r;const all=A.db.sales.filter(x=>x.status==='done'&&A.dk(x.at)===day).sort((a,b)=>b.at-a.at);A.$('rep').innerHTML=`<p class=mu>${lbl()}</p><div class=kpi><div><small>Uang diterima</small><b>${A.rp(r.uang)}</b></div><div><small>Transaksi</small><b>${r.ok.length}</b></div><div><small>Stok awal</small><b>${r.tot.awal}</b></div><div><small>Stok masuk</small><b>${r.tot.in}</b></div><div><small>Stok keluar</small><b>${r.tot.out}</b></div></div><p class=mu>${Object.entries(r.by).map(([k,v])=>`${k}: ${A.rp(v)}`).join(' · ')||'Belum ada penjualan pada tanggal ini'}</p><h3>Stok per produk</h3><div class=tw><table><tr><th>Produk<th>Stok awal<th>Stok in<th>Stok out<th>Terjual<th>Sisa</tr>${r.rows.map(x=>`<tr><td>${A.esc(x.name)}</td><td>${n(x.awal)}</td><td>${n(x.in)}</td><td>${n(x.out)}</td><td>${x.jual}</td><td><b>${n(x.sisa)}</b></td></tr>`).join('')||'<tr><td colspan="6">Belum ada data.</td></tr>'}<tr class="sum"><td>TOTAL</td><td>${r.tot.awal}</td><td>${r.tot.in}</td><td>${r.tot.out}</td><td>${r.tot.jual}</td><td>${r.tot.sisa}</td></tr></table></div><p class=mu>Sisa = stok awal + in − out − terjual. Transaksi yang di-refund tidak dihitung.</p><h3>Riwayat penjualan</h3><div class=tw><table><tr><th>No<th>Waktu<th>Metode<th>Diterima<th></tr>${all.map(s=>`<tr><td>${s.no}<td>${new Date(s.at).toLocaleTimeString('id-ID')}<td>${s.method}<td>${A.rp(s.total)}<td><button class="btn2 sm" onclick="App.lPrint('${s.id}')">Struk</button> ${s.status==='done'?`<button class="btn2 sm" onclick="App.lVoid('${s.id}')">Refund</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada penjualan.</td></tr>'}</table></div>`};
A.after.laporan=render;
const txt=()=>{const r=A._rep,T=A.db.settings;if(!r)return'';const n=r.n;return [
`*Laporan ${T.name}*`,
lbl(),
`Dibuat: ${new Date().toLocaleString('id-ID')}`,
...(T.kasir?['Kasir: '+T.kasir]:[]),
...(T.lokasi?['Lokasi: '+T.lokasi]:[]),
`Total uang diterima: ${A.rp(r.uang)}`,
`Transaksi: ${r.ok.length}`,
`Stok awal: ${r.tot.awal} | Stok in: ${r.tot.in} | Stok out: ${r.tot.out} | Terjual: ${r.tot.jual} | Sisa: ${r.tot.sisa}`,
...r.rows.map(x=>`${x.name}: awal ${n(x.awal)} | in ${n(x.in)} | out ${n(x.out)} | jual ${x.jual} | sisa ${n(x.sisa)}`)
].join('\n')};
A.wa=()=>{const el=A.$('wano');let n=(el.value||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);A.db.settings.waNo=el.value.trim();A.save();const u='https://wa.me/'+n+'?text='+encodeURIComponent(txt());if(!window.open(u,'_blank'))location.href=u};
A.waShare=()=>navigator.share?navigator.share({text:txt()}).catch(()=>{}):A.toast('Bagikan tidak didukung di sini — pakai Salin teks');
A.waCopy=()=>{const t=txt(),ok=()=>A.toast('Teks laporan disalin');if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(ok,()=>A.toast('Gagal menyalin'));const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')?ok():A.toast('Gagal menyalin')}catch(e){A.toast('Gagal menyalin')}x.remove()};
A.lD=v=>{if(v){day=v;render()}};
A.lPrint=id=>A.receipt(A.db.sales.find(s=>s.id===id));
A.lVoid=id=>{const s=A.db.sales.find(s=>s.id===id);if(!s||s.status!=='done'||!confirm('Refund '+s.no+'? Stok kembali dihitung.'))return;s.status='refund';A.save();render()};
const csv=(n,r)=>A.download(n,r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
A.lCsv=()=>{const r=calc();csv('stok-'+day+'.csv',[['produk','stok_awal','stok_in','stok_out','terjual','sisa'],...r.rows.map(x=>[x.name,x.awal,x.in,x.out,x.jual,x.sisa]),['TOTAL',r.tot.awal,r.tot.in,r.tot.out,r.tot.jual,r.tot.sisa]])};
A.lCsvJ=()=>csv('penjualan-'+day+'.csv',[['no','waktu','metode','diterima'],...A.db.sales.filter(s=>s.status==='done'&&A.dk(s.at)===day).map(s=>[s.no,new Date(s.at).toISOString(),s.method,s.total])]);
})(App);
</script>
<script>
(function(A){
const tabs={laporan:'Laporan',pos:'Kasir',terima:'Terima',produk:'Produk',set:'Pengaturan'};
A.views.set=()=>{const s=A.db.settings;return`<h2>Pengaturan</h2><form class="card grid" onsubmit="App.sSave(event)"><label>Nama toko<input name=name value="${A.esc(s.name)}" required></label><label>Nama kasir<input name=kasir value="${A.esc(s.kasir)}"></label><label>Lokasi merchant<input name=lokasi value="${A.esc(s.lokasi)}" placeholder="mis. Jl. Mawar No. 5, Kota"></label><label>No. kontak / WA<input name=kontak type=tel value="${A.esc(s.kontak)}"></label><label>Instagram<input name=ig value="${A.esc(s.ig)}" placeholder="username"></label><label>TikTok<input name=tiktok value="${A.esc(s.tiktok)}" placeholder="username"></label><label>Pajak (%)<input name=tax type=number min=0 max=100 step=0.1 value="${s.tax||0}"></label><button class=btn>Simpan</button></form><div class=card><h3>Backup &amp; Restore</h3><p class=mu>Data tersimpan di browser (localStorage). Jika data situs dihapus, data hilang — rutin unduh backup.</p><button class=btn onclick="App.sBackup()">Unduh backup JSON</button> <label class=btn2 style="display:inline-block;cursor:pointer;padding:.6rem 1rem">Restore<input type=file accept=".json" hidden onchange="App.sRestore(this.files[0])"></label><button class=btn2 onclick="App.sDemo()">Isi contoh (2 ukuran cup)</button> <button class=btn2 onclick="App.sReset()">Hapus semua data</button></div>`};
A.sSave=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(A.db.settings,{name:f.get('name').trim(),kasir:f.get('kasir').trim(),lokasi:f.get('lokasi').trim(),kontak:f.get('kontak').trim(),ig:f.get('ig').trim(),tiktok:f.get('tiktok').trim(),tax:+(f.get('tax')||0)});A.save();A.toast('Tersimpan');A.go('set')};
A.sBackup=()=>A.download('omnipos-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:2,...A.db}),'application/json');
A.sRestore=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.settings)throw 0;if(!confirm(`Timpa data lokal dengan backup ${f.name}?`))return;Object.assign(A.db,d);A.migrate();A.save();A.toast('Backup dipulihkan');A.go('pos')}catch(e){A.toast('Backup tidak valid')}};r.readAsText(f)};
A.sDemo=()=>{if(A.db.products.length&&!confirm('Tambahkan contoh produk?'))return;[['Minuman - Cup Kecil',12000],['Minuman - Cup Besar',15000]].forEach(([name,price])=>{if(!A.db.products.some(p=>p.name===name))A.db.products.push({id:A.id(),name,price,archived:false})});A.save();A.go('produk')};
A.sReset=()=>{if(confirm('Hapus SEMUA data? Tidak bisa dibatalkan.')&&confirm('Yakin? Unduh backup dulu bila perlu.')){localStorage.removeItem('omnipos_v1');location.reload()}};
const TH=['system','light','dark'],THL={system:'Sistem',light:'Terang',dark:'Gelap'};
A.applyTheme=()=>{const t=A.db.settings.theme||'system';if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;A.$('th').textContent='Tema: '+(THL[t]||'Sistem')};
A.theme=()=>{const t=A.db.settings.theme||'system';A.db.settings.theme=TH[(TH.indexOf(t)+1)%3];A.save();A.applyTheme()};
A.go=n=>{A.applyTheme();A.$('brand').textContent=A.db.settings.name;A.$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===n?'on':''}" onclick="App.go('${k}')">${v}</button>`).join('');const view=A.views[n];if(view){A.$('main').innerHTML=view();if(A.after[n])A.after[n]();}};
A.go('pos');
})(App);
</script>
</body></html>
